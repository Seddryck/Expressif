name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config/dotnet-tools.json'
      - '.github/workflows/pages.yml'
      - 'Build-Logo.ps1'
      - 'Expressif.Syntax/**'
      - 'assets/logo/**'
      - 'docs/**'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install --yes imagemagick

      - name: Generate branding assets
        shell: pwsh
        run: |
          ./Build-Logo.ps1
          Copy-Item artifacts/branding/expressif-icon-dark-256.png docs/assets/images/expressif-logo.png -Force
          Copy-Item artifacts/branding/expressif-icon-light-256.png docs/assets/images/expressif-logo-reversed.png -Force
          Copy-Item artifacts/branding/expressif-logo-dark-256.png docs/assets/images/expressif-logo-with-name.png -Force
          Copy-Item artifacts/branding/favicon.ico docs/assets/images/favicon.ico -Force

      - name: Generate Rouge lexer
        working-directory: Expressif.Syntax
        shell: pwsh
        run: |
          ./New-RougeLexer.ps1 `
            -InputFolder ../docs/_data `
            -OutputPath ../docs/_plugins/expressif.rb `
            -Standalone $true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: docs
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Validate language deprecations
        shell: pwsh
        run: ./Test-LanguageDeprecationPage.ps1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
