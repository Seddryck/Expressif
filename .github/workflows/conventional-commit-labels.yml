name: Conventional commit labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  synchronize-labels:
    name: Synchronize labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Synchronize conventional commit labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const mapping = JSON.parse(
              fs.readFileSync('.github/conventional_commits_labels.json', 'utf8')
            );
            const title = context.payload.pull_request.title;
            const match = title.match(/^([^:]+):/);

            if (!match) {
              core.setFailed(`Pull request title is not a valid conventional commit: "${title}"`);
              return;
            }

            const header = match[1].trim();
            const typeMatch = header.match(/^([^(!\s]+)(?:\([^)]*\))?(!)?$/);

            if (!typeMatch || !Object.hasOwn(mapping, typeMatch[1])) {
              core.setFailed(`Pull request title is not a valid conventional commit: "${title}"`);
              return;
            }

            const expected = new Set([mapping[typeMatch[1]]]);
            if (typeMatch[2] && Object.hasOwn(mapping, '!')) {
              expected.add(mapping['!']);
            }
            expected.delete('none');

            const managed = new Set(
              Object.values(mapping).filter(label => label !== 'none')
            );
            const existing = new Set(
              context.payload.pull_request.labels.map(label => label.name)
            );
            const stale = [...existing].filter(
              label => managed.has(label) && !expected.has(label)
            );
            const missing = [...expected].filter(label => !existing.has(label));
            const issue_number = context.issue.number;

            for (const name of stale) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number,
                name
              });
            }

            if (missing.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number,
                labels: missing
              });
            }

            core.info(`Expected managed labels: ${[...expected].join(', ') || '(none)'}`);
            core.info(`Removed stale labels: ${stale.join(', ') || '(none)'}`);
            core.info(`Added missing labels: ${missing.join(', ') || '(none)'}`);
