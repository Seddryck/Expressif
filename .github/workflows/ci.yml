name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next-major
    tags-ignore:
      - '**'
    paths-ignore:
      - '.githooks/**'
      - 'misc/**'
      - 'README.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    paths-ignore:
      - '.githooks/**'
      - 'misc/**'
      - 'README.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

env:
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  calculate-version:
    runs-on: windows-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      patch: ${{ steps.version.outputs.patch }}
      conformance-semver: ${{ steps.conformance-version.outputs.semver }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        shell: pwsh
        run: ./install-gitversion.ps1

      - name: calculate-version
        id: version
        shell: pwsh
        run: |
          $version = gitversion /output json | ConvertFrom-Json
          "semver=$($version.SemVer)" >> $env:GITHUB_OUTPUT
          "patch=$($version.Patch)" >> $env:GITHUB_OUTPUT
          Write-Host "Building Expressif version $($version.SemVer)"

      - name: Calculate conformance version
        id: conformance-version
        shell: pwsh
        run: |
          . ./Conformance.ps1
          $version = Get-ConformanceVersion -Warn
          "semver=$version" >> $env:GITHUB_OUTPUT

  package-branding:
    needs: calculate-version
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate branding assets
        shell: pwsh
        run: ./Build-Logo.ps1 -Version '${{ needs.calculate-version.outputs.semver }}'

      - name: Verify tracked README logo
        shell: pwsh
        run: |
          $generated = Get-FileHash artifacts/branding/expressif-logo-dark-256.png -Algorithm SHA256
          $tracked = Get-FileHash docs/assets/images/expressif-logo-with-name.png -Algorithm SHA256
          if ($generated.Hash -ne $tracked.Hash) {
            throw 'The tracked README logo differs from the generated branding asset.'
          }

      - name: Upload branding package
        uses: actions/upload-artifact@v7
        with:
          name: branding-assets
          if-no-files-found: error
          path: artifacts/branding/expressif-branding-${{ needs.calculate-version.outputs.semver }}.zip

  validate-conformance:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install conformance dependencies
        shell: pwsh
        run: . ./Conformance.ps1; Install-ConformanceDependencies

      - name: Validate conformance definitions
        shell: pwsh
        run: |
          . ./Conformance.ps1
          $violations = Validate-Conformance -Path ./conformance
          if ($violations -gt 0) {
            throw "Conformance validation failed with $violations violation(s)."
          }

      - name: Upload validated conformance source
        uses: actions/upload-artifact@v7
        with:
          name: conformance-source
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            conformance/**
            Conformance.ps1
            ConformanceReport.psm1
            Export-ConformanceReport.ps1
            .config/dotnet-tools.json

  test-conformance:
    needs:
      - calculate-version
      - validate-conformance
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            .config/dotnet-tools.json

      - name: Restore conformance test dependencies
        run: >-
          dotnet restore Expressif.Testing/Expressif.Testing.csproj
          --use-lock-file
          --force-evaluate

      - name: Build conformance test project
        run: >-
          dotnet build Expressif.Testing/Expressif.Testing.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --nologo
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Create conformance report directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path conformance/bin -Force | Out-Null

      - name: Run .NET conformance tests
        run: >-
          dotnet vstest Expressif.Testing/bin/Release/net10.0/Expressif.Testing.dll
          --TestCaseFilter:TestCategory=conformance
          --Logger:"nunit;LogFilePath=conformance/bin/Expressif.Conformance.DotNet.xml"

      - name: Validate .NET conformance test report
        shell: pwsh
        run: >-
          ./Validate-ConformanceTestReport.ps1
          -AssemblyPath ./Expressif.Testing/bin/Release/net10.0/Expressif.Testing.dll
          -ReportPath ./conformance/bin/Expressif.Conformance.DotNet.xml

      - name: Upload conformance test report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-test-report
          if-no-files-found: error
          retention-days: 7
          path: conformance/bin/Expressif.Conformance.DotNet.xml

  build-and-tests:
    name: build and tests (${{ matrix.name }})
    needs:
      - calculate-version
      - validate-conformance
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library, net8.0
            project: Expressif.Testing/Expressif.Testing.csproj
            framework: net8.0
            coverage: expressif-net8.0
            suite: coverage
          - name: library, net9.0
            project: Expressif.Testing/Expressif.Testing.csproj
            framework: net9.0
            coverage: expressif-net9.0
            suite: coverage
          - name: library, net10.0
            project: Expressif.Testing/Expressif.Testing.csproj
            framework: net10.0
            coverage: expressif-net10.0
            suite: coverage
          - name: CLI, net10.0
            project: Expressif.Cli.Tests/Expressif.Cli.Tests.csproj
            framework: net10.0
            coverage: expressif-cli-net10.0
            suite: coverage
            generate_cli_lock: true
          - name: documentation, net10.0
            project: Expressif.Testing/Expressif.Testing.csproj
            framework: net10.0
            suite: documentation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            .config/dotnet-tools.json

      - name: Restore test dependencies
        if: ${{ !matrix.generate_cli_lock }}
        run: >-
          dotnet restore ${{ matrix.project }}
          --use-lock-file
          --force-evaluate

      - name: Generate branding assets
        if: matrix.generate_cli_lock
        shell: pwsh
        run: ./Build-Logo.ps1

      - name: Generate CLI dependency lock
        if: matrix.generate_cli_lock
        run: >-
          dotnet restore Expressif.Cli/Expressif.Cli.csproj
          --use-lock-file
          --force-evaluate

      - name: Restore CLI test dependencies with generated lock
        if: matrix.generate_cli_lock
        run: dotnet restore ${{ matrix.project }} --locked-mode

      - name: Build test project
        run: >-
          dotnet build ${{ matrix.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-restore
          --nologo
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Validate metadata consistency
        if: matrix.suite == 'coverage' && matrix.coverage == 'expressif-net10.0'
        run: >-
          dotnet test ${{ matrix.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-build
          --no-restore
          --nologo
          --filter TestCategory=MetadataConsistency

      - name: Run tests with coverage
        if: matrix.suite == 'coverage'
        shell: pwsh
        run: |
          $results = '.coverage/results'
          dotnet test '${{ matrix.project }}' `
            --configuration Release `
            --framework '${{ matrix.framework }}' `
            --no-build `
            --no-restore `
            --nologo `
            --filter 'TestCategory!=MetadataConsistency&TestCategory!=documentation' `
            --collect 'XPlat Code Coverage;Format=opencover' `
            --results-directory $results

          if ($LASTEXITCODE -ne 0) {
            throw 'Tests failed for ${{ matrix.name }}.'
          }

          $report = Get-ChildItem -Path $results -Recurse -File -Filter coverage.opencover.xml |
            Select-Object -First 1
          if ($null -eq $report) {
            throw 'Coverage report was not generated for ${{ matrix.name }}.'
          }
          Copy-Item $report.FullName '.coverage/${{ matrix.coverage }}.xml'

      - name: Run documentation tests
        if: matrix.suite == 'documentation'
        run: >-
          dotnet test ${{ matrix.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-build
          --no-restore
          --nologo
          --filter TestCategory=documentation

      - name: Upload CLI dependency lock
        if: matrix.generate_cli_lock
        uses: actions/upload-artifact@v7
        with:
          name: expressif-cli-dependency-lock
          if-no-files-found: error
          retention-days: 7
          path: Expressif.Cli/packages.lock.json

      - name: Upload coverage to Codecov
        if: matrix.suite == 'coverage'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          files: ./.coverage/${{ matrix.coverage }}.xml
          flags: ${{ matrix.coverage }}
          name: ${{ matrix.coverage }}
          fail_ci_if_error: true
          disable_search: true
          use_oidc: true

  package-nuget:
    name: package (${{ matrix.name }})
    needs:
      - calculate-version
      - build-and-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Expressif NuGet
            project: Expressif/Expressif.csproj
            pack_arguments: --include-symbols
            artifact: expressif-nuget-package
            paths: |
              Expressif/bin/Release/*.nupkg
              Expressif/bin/Release/*.snupkg
          - name: CLI NuGet
            project: Expressif.Cli/Expressif.Cli.csproj
            pack_arguments: ''
            artifact: expressif-cli-nuget-package
            use_generated_lock: true
            paths: |
              Expressif.Cli/bin/Release/*.nupkg
              Expressif.Cli/bin/Release/*.snupkg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            .config/dotnet-tools.json

      - name: Download CLI dependency lock
        if: matrix.use_generated_lock
        uses: actions/download-artifact@v8
        with:
          name: expressif-cli-dependency-lock
          path: Expressif.Cli

      - name: Generate branding assets
        shell: pwsh
        run: ./Build-Logo.ps1

      - name: Restore package dependencies
        if: matrix.use_generated_lock
        run: dotnet restore ${{ matrix.project }} --locked-mode

      - name: Generate package dependency lock
        if: ${{ !matrix.use_generated_lock }}
        run: >-
          dotnet restore ${{ matrix.project }}
          --use-lock-file
          --force-evaluate

      - name: Pack NuGet packages
        run: >-
          dotnet pack ${{ matrix.project }}
          --configuration Release
          ${{ matrix.pack_arguments }}
          --no-restore
          --nologo
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}

  package-conformance:
    needs:
      - calculate-version
      - validate-conformance
      - test-conformance
    runs-on: windows-latest
    steps:

      - name: Download validated conformance source
        uses: actions/download-artifact@v8
        with:
          name: conformance-source

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download conformance test report
        uses: actions/download-artifact@v8
        with:
          name: conformance-test-report
          path: conformance/bin

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Install conformance dependencies
        shell: pwsh
        run: . ./Conformance.ps1; Install-ConformanceDependencies

      - name: Package conformance assets
        shell: pwsh
        env:
          GitVersion_SemVer: ${{ needs.calculate-version.outputs.semver }}
          GitVersion_Conformance_SemVer: conformance-${{ needs.calculate-version.outputs.conformance-semver }}
        run: |
          . ./Conformance.ps1
          Package-Conformance `
            -Version '${{ needs.calculate-version.outputs.conformance-semver }}' `
            -CommitSha '${{ github.sha }}'
          ./Export-ConformanceReport.ps1 `
            -Path ./conformance `
            -ReportPath ./conformance/bin/Expressif.Conformance.DotNet.xml `
            -OutputYamlPath ./conformance/bin/expressif.conformance.dotnet.${{ needs.calculate-version.outputs.semver }}.yaml `
            -Platform dotnet `
            -PlatformVersion ${{ needs.calculate-version.outputs.semver }} `
            -ConformanceVersion $env:GitVersion_Conformance_SemVer `
            -NUnit

      - name: Upload conformance artifacts
        uses: actions/upload-artifact@v7
        with:
          name: conformance-packages
          if-no-files-found: error
          path: |
            conformance/bin/conformance.manifest.yaml
            conformance/bin/expressif.conformance.*.zip
            conformance/bin/expressif.conformance.dotnet.*.yaml

  package-syntax-highlighters:
    needs: calculate-version
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            .config/dotnet-tools.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Generate syntax assets
        shell: pwsh
        working-directory: Expressif.Syntax
        run: ./New-tmBundle.ps1 -Bundle expressif-syntax -Version ${{ needs.calculate-version.outputs.semver }}

      - name: Upload syntax assets
        uses: actions/upload-artifact@v7
        with:
          name: syntax-assets
          if-no-files-found: error
          path: Expressif.Syntax/bin/**

  package-cli-distributions:
    needs:
      - calculate-version
      - build-and-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            runtime: win-x64
            installer: false
          - framework: net8.0
            runtime: win-arm64
            installer: false
          - framework: net8.0
            runtime: linux-x64
            installer: false
          - framework: net8.0
            runtime: linux-musl-x64
            installer: false
          - framework: net9.0
            runtime: win-x64
            installer: false
          - framework: net9.0
            runtime: win-arm64
            installer: false
          - framework: net9.0
            runtime: linux-x64
            installer: false
          - framework: net9.0
            runtime: linux-musl-x64
            installer: false
          - framework: net10.0
            runtime: win-x64
            installer: true
          - framework: net10.0
            runtime: win-arm64
            installer: true
          - framework: net10.0
            runtime: linux-x64
            installer: false
          - framework: net10.0
            runtime: linux-musl-x64
            installer: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            .config/dotnet-tools.json

      - name: Download CLI dependency lock
        uses: actions/download-artifact@v8
        with:
          name: expressif-cli-dependency-lock
          path: Expressif.Cli

      - name: Generate branding assets
        shell: pwsh
        run: ./Build-Logo.ps1

      - name: Restore distribution dependencies
        run: dotnet restore Expressif.Cli/Expressif.Cli.csproj --locked-mode

      - name: Install Inno Setup
        if: matrix.installer
        shell: pwsh
        run: ./distribution/Install-Iscc.ps1

      - name: Publish distribution
        shell: pwsh
        run: >-
          ./distribution/build-distribution.ps1
          -Mode Publish
          -Version ${{ needs.calculate-version.outputs.semver }}
          -Configuration Release
          -Frameworks ${{ matrix.framework }}
          -Runtimes ${{ matrix.runtime }}

      - name: Archive distribution
        shell: pwsh
        run: >-
          ./distribution/build-distribution.ps1
          -Mode Archive
          -Version ${{ needs.calculate-version.outputs.semver }}
          -Configuration Release
          -Frameworks ${{ matrix.framework }}
          -Runtimes ${{ matrix.runtime }}

      - name: Build Windows installer
        if: matrix.installer
        shell: pwsh
        run: >-
          ./distribution/build-distribution.ps1
          -Mode Bundle
          -Version ${{ needs.calculate-version.outputs.semver }}
          -Configuration Release
          -Frameworks ${{ matrix.framework }}
          -Runtimes ${{ matrix.runtime }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ matrix.framework }}-${{ matrix.runtime }}
          if-no-files-found: error
          path: |
            distribution/bin/archives/expressif-*.*
            distribution/bin/installers/expressif-*-setup.exe*

  publish-nuget:
    needs: package-nuget
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Expressif package
        uses: actions/download-artifact@v8
        with:
          name: expressif-nuget-package
          path: packages/expressif

      - name: Download CLI package
        uses: actions/download-artifact@v8
        with:
          name: expressif-cli-nuget-package
          path: packages/cli

      - name: Validate package artifacts
        shell: pwsh
        run: |
          $expectedArtifacts = @(
            @{ Name = 'Expressif package'; Path = 'packages/expressif'; Filter = '*.nupkg'; Count = 1 },
            @{ Name = 'Expressif symbol package'; Path = 'packages/expressif'; Filter = '*.snupkg'; Count = 1 },
            @{ Name = 'Expressif CLI packages'; Path = 'packages/cli'; Filter = '*.nupkg'; Count = 5 }
          )

          foreach ($artifact in $expectedArtifacts) {
            $matches = @(Get-ChildItem -Path $artifact.Path -File -Filter $artifact.Filter)
            if ($matches.Count -ne $artifact.Count) {
              throw "Expected $($artifact.Count) $($artifact.Name), found $($matches.Count)."
            }
            Write-Host "Found $($artifact.Name): $($matches.Name -join ', ')"
          }

      - name: Authenticate with NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Seddryck

      - name: Publish packages and symbols to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem -Path packages -Recurse -File -Filter '*.nupkg'
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish $($package.Name)."
            }
          }

  publish-github-release:
    needs:
      - calculate-version
      - package-branding
      - package-conformance
      - package-syntax-highlighters
      - package-cli-distributions
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.calculate-version.outputs.patch == '0'
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Download syntax assets
        uses: actions/download-artifact@v8
        with:
          name: syntax-assets
          path: release-assets/syntax

      - name: Download branding assets
        uses: actions/download-artifact@v8
        with:
          name: branding-assets
          path: release-assets/branding

      - name: Download conformance assets
        uses: actions/download-artifact@v8
        with:
          name: conformance-packages
          path: release-assets/conformance

      - name: Download distribution assets
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          merge-multiple: true
          path: release-assets/distribution

      - name: Validate release assets
        shell: pwsh
        run: |
          $expectedAssets = @(
            @{ Name = 'branding ZIP'; Path = 'release-assets/branding'; Extensions = @('.zip') },
            @{ Name = 'syntax asset'; Path = 'release-assets/syntax'; Extensions = @('.vsix', '.json', '.xml', '.zip') },
            @{ Name = 'conformance ZIP'; Path = 'release-assets/conformance'; Extensions = @('.zip') },
            @{ Name = 'conformance YAML'; Path = 'release-assets/conformance'; Extensions = @('.yaml') },
            @{ Name = 'distribution archive'; Path = 'release-assets/distribution'; Extensions = @('.zip', '.gz') },
            @{ Name = 'Windows installer'; Path = 'release-assets/distribution'; Extensions = @('.exe') }
          )

          foreach ($expected in $expectedAssets) {
            $matches = @(Get-ChildItem -Path $expected.Path -Recurse -File |
              Where-Object Extension -In $expected.Extensions)
            if ($matches.Count -eq 0) {
              throw "Expected at least one $($expected.Name), found none."
            }
            Write-Host "Found $($matches.Count) $($expected.Name) file(s)."
          }

          $manifest = 'release-assets/conformance/conformance.manifest.yaml'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Expected conformance manifest '$manifest', found none."
          }
          Write-Host "Found conformance manifest: $manifest"

          $releaseAssets = @(Get-ChildItem -Path release-assets -Recurse -File)
          $mixedCaseAssets = @($releaseAssets | Where-Object {
            $_.Name -cne $_.Name.ToLowerInvariant()
          })
          if ($mixedCaseAssets.Count -gt 0) {
            throw "Release asset names must be lower-case: $($mixedCaseAssets.Name -join ', ')"
          }

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.semver }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target $env:GITHUB_SHA `
              --title "Expressif $env:RELEASE_VERSION" `
              --generate-notes `
              --discussion-category Announcements
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $tag."
            }
          }
          else {
            Write-Host "Reusing existing release $tag."
          }

          $assetExtensions = @('.vsix', '.json', '.xml', '.zip', '.yaml', '.gz', '.exe')
          $assets = @(Get-ChildItem -Path release-assets -Recurse -File |
            Where-Object Extension -In $assetExtensions)
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload assets to release $tag."
          }
