<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.querySelector(
      ".search-input, input[type='search']"
    );

    if (searchInput) {
      searchInput.setAttribute("placeholder", "Search");
      searchInput.setAttribute("aria-label", "Search Expressif documentation");
    }
  });
</script>
