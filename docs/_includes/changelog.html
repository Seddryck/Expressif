<div class="timeline">
    {% for version in site.data.changelog %}
    <article class="timeline__entry{% if version.featured %} timeline__entry--featured{% endif %}">
        <div class="timeline__date">
            <h5>{{ version.date }}</h5>
        </div>
        <div class="timeline__content">
            <h3>{{ version.title }}{% if version.label %}<span class="timeline__label">{{ version.label }}</span>{% endif %}</h3>
            <ul>
                {% for item in version.list %}
                <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
    </article>
    {% endfor %}
</div>
