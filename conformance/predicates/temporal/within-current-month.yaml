suite: temporal
kind: predicate
operator: is-within-current-month
tests:
  - id: within-current-month.valid.date-time
    cases:
      - id: within-current-month.valid.date-time.temporal.tomorrow-in-month
        value: 2022-12-30
        expected: true
      - id: within-current-month.valid.date-time.temporal.first-day-of-month
        value: 2022-12-01
        expected: true
      - id: within-current-month.valid.date-time.temporal.yesterday-in-month
        value: 2022-12-28
        expected: true
      - id: within-current-month.valid.date-time.temporal.today
        value: 2022-12-29
        expected: true
      - id: within-current-month.valid.date-time.temporal.last-year
        value: 2021-12-30
        expected: false
      - id: within-current-month.valid.date-time.temporal.first-day-of-next-month
        value: 2023-01-01
        expected: false
      - id: within-current-month.valid.date-time.temporal.epoch
        value: 1970-05-06
        expected: false
