suite: temporal
kind: predicate
operator: yesterday
tests:
  - id: yesterday.valid.date-time
    cases:
      - id: yesterday.valid.date-time.temporal.yesterday
        value: 2022-12-28T14:00:00
        expected: true
      - id: yesterday.valid.date-time.temporal.today
        value: 2022-12-29T14:00:00
        expected: false
      - id: yesterday.valid.date-time.temporal.tomorrow
        value: 2022-12-30T14:00:00
        expected: false
      - id: yesterday.valid.date-time.temporal.epoch
        value: 1970-05-06T00:00:00
        expected: false
  - id: yesterday.valid.date
    cases:
      - id: yesterday.valid.date.temporal.yesterday
        value: 2022-12-28
        expected: true
      - id: yesterday.valid.date.temporal.today
        value: 2022-12-29
        expected: false
      - id: yesterday.valid.date.temporal.tomorrow
        value: 2022-12-30
        expected: false
      - id: yesterday.valid.date.temporal.epoch
        value: 1970-05-06
        expected: false
