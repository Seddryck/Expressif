suite: temporal
kind: predicate
operator: is-within-last-week
tests:
  - id: is-within-last-week.valid.date-time
    cases:
      - id: is-within-last-week.valid.date-time.temporal.last-day-of-two-weeks-ago
        value: 2022-12-18
        expected: false
      - id: is-within-last-week.valid.date-time.temporal.first-day-of-last-week
        value: 2022-12-19
        expected: true
      - id: is-within-last-week.valid.date-time.temporal.last-day-of-last-week
        value: 2022-12-25
        expected: true
      - id: is-within-last-week.valid.date-time.temporal.yesterday-in-current-week
        value: 2022-12-28
        expected: false
      - id: is-within-last-week.valid.date-time.temporal.today
        value: 2022-12-29
        expected: false
      - id: is-within-last-week.valid.date-time.temporal.tomorrow-in-current-week
        value: 2022-12-30
        expected: false
      - id: is-within-last-week.valid.date-time.temporal.last-day-of-current-week
        value: 2023-01-01
        expected: false
