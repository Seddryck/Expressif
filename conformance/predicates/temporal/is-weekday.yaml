suite: temporal
kind: predicate
operator: is-weekday
tests:
  - id: is-weekday.valid.date
    cases:
     - id: is-weekday.valid.date.wednesday.expected
       value: 2022-12-28
       expected: true
       parameters:
         - wednesday
     - id: is-weekday.valid.date.thursday.unexpected
       value: 2022-12-28
       expected: false
       parameters:
         - thursday
     - id: is-weekday.valid.date.thursday.expected
       value: 2022-12-29
       expected: true
       parameters:
         - thursday
     - id: is-weekday.valid.date.monday.unexpected
       value: 2022-12-29
       expected: false
       parameters:
         - monday
