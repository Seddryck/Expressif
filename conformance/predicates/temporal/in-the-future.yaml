suite: temporal
kind: predicate
operator: in-the-future
tests:
  - id: in-the-future.valid.date-time
    cases:
      - id: in-the-future.valid.date-time.past
        value: 2022-12-28 14:00:00
        expected: false
      - id: in-the-future.valid.date-time.today-past
        value: 2022-12-29 14:00:00
        expected: false
      - id: in-the-future.valid.date-time.now
        value: 2022-12-29 15:00:00
        expected: false
      - id: in-the-future.valid.date-time.today-future
        value: 2022-12-29 16:00:00
        expected: false
      - id: in-the-future.valid.date-time.future
        value: 2022-12-30 16:00:00
        expected: true
  - id: in-the-future.valid.date-only
    cases:
      - id: in-the-future.valid.date-only.past
        value: 2022-12-28
        expected: false
      - id: in-the-future.valid.date-only.today
        value: 2022-12-29
        expected: false
      - id: in-the-future.valid.date-only.future
        value: 2022-12-30
        expected: true
