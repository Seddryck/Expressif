suite: temporal
kind: predicate
operator: is-within-current-year
tests:
  - id: within-current-year.valid.date-time
    cases:
      - id: within-current-year.valid.date-time.temporal.last-day-of-previous-year
        value: 2021-12-31
        expected: false
      - id: within-current-year.valid.date-time.temporal.last-day-of-previous-month-in-year
        value: 2022-11-30
        expected: true
      - id: within-current-year.valid.date-time.temporal.first-day-of-month
        value: 2022-12-01
        expected: true
      - id: within-current-year.valid.date-time.temporal.yesterday-in-year
        value: 2022-12-28
        expected: true
      - id: within-current-year.valid.date-time.temporal.today
        value: 2022-12-29
        expected: true
      - id: within-current-year.valid.date-time.temporal.tomorrow-in-year
        value: 2022-12-30
        expected: true
      - id: within-current-year.valid.date-time.temporal.first-day-of-next-year
        value: 2023-01-01
        expected: false
      - id: within-current-year.valid.date-time.temporal.epoch
        value: 1970-05-06
        expected: false
