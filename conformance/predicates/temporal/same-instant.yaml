suite: temporal
kind: predicate
operator: is-same-instant
tests:
  - id: same-instant.valid.date-time
    cases:
      - id: same-instant.valid.date-time.today
        value: 2022-11-21
        expected: true
        parameters:
          - 2022-11-21
      - id: same-instant.valid.date-time.yesterday
        value: 2022-11-20
        expected: false
        parameters:
          - 2022-11-21
      - id: same-instant.valid.date-time.tomorrow
        value: 2022-11-22
        expected: false
        parameters:
          - 2022-11-21
      - id: same-instant.valid.date-time.same-date-time
        value: 2022-11-21 17:12:24
        expected: true
        parameters:
          - 2022-11-21 17:12:24
      - id: same-instant.valid.date-time.different-time
        value: 2022-11-21 17:12:25
        expected: false
        parameters:
          - 2022-11-21 17:12:24
      - id: same-instant.valid.special.empty
        value: 
        expected: false
        parameters:
          - 2022-11-21
      - id: same-instant.valid.special.null
        value: (null)
        expected: false
        parameters:
          - 2022-11-21
