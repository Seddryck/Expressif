suite: temporal
kind: predicate
operator: leap-year
tests:
  - id: leap-year.valid.date-time
    cases:
      - id: leap-year.valid.date-time.1900
        value: 1900-03-15
        expected: false
      - id: leap-year.valid.date-time.1999
        value: 1999-03-15
        expected: false
      - id: leap-year.valid.date-time.2000
        value: 2000-03-15
        expected: true
      - id: leap-year.valid.date-time.2024
        value: 2024-03-15
        expected: true
  - id: leap-year.valid.text
    cases:
      - id: leap-year.valid.text.leap-date
        value: 2000-03-15
        expected: true
      - id: leap-year.valid.text.leap-year-month
        value: 2000-03
        expected: true
      - id: leap-year.valid.text.leap-year
        value: 2000
        expected: true
  - id: leap-year.valid.year-month
    cases:
      - id: leap-year.valid.year-month.1900
        value: 1900-03
        expected: false
      - id: leap-year.valid.year-month.1999
        value: 1999-03
        expected: false
      - id: leap-year.valid.year-month.2000
        value: 2000-03
        expected: true
      - id: leap-year.valid.year-month.2024
        value: 2024-03
        expected: true
  - id: leap-year.valid.year
    cases:
      - id: leap-year.valid.year.1900
        value: 1900
        expected: false
      - id: leap-year.valid.year.1999
        value: 1999
        expected: false
      - id: leap-year.valid.year.2000
        value: 2000
        expected: true
      - id: leap-year.valid.year.2024
        value: 2024
        expected: true
