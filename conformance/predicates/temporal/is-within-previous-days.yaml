suite: temporal
kind: predicate
operator: is-within-previous-days
tests:
  - id: is-within-previous-days.valid.date-time
    parameters:
      - 2022-12-29
      - 3
    cases:
      - id: is-within-previous-days.valid.date-time.temporal.first-day-outside-range
        value: 2022-12-25
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.third-day-ago-within-range
        value: 2022-12-26
        expected: true
      - id: is-within-previous-days.valid.date-time.temporal.yesterday-within-range
        value: 2022-12-28
        expected: true
      - id: is-within-previous-days.valid.date-time.temporal.today
        value: 2022-12-29
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.tomorrow
        value: 2022-12-30
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.next-year-day
        value: 2023-01-01
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.next-week
        value: 2023-01-02
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.after-next-week
        value: 2023-01-08
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.far-future
        value: 2023-01-09
        expected: false
      - id: is-within-previous-days.valid.date-time.temporal.epoch
        value: 1970-05-06
        expected: false
