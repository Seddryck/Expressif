suite: temporal
kind: predicate
operator: is-within-upcoming-month
tests:
  - id: is-within-upcoming-month.valid.date-time
    parameters:
      - 2022-12-29
    cases:
      - id: is-within-upcoming-month.valid.date-time.temporal.last-day-of-previous-month
        value: 2022-11-30
        expected: false
      - id: is-within-upcoming-month.valid.date-time.temporal.first-day-of-current-month
        value: 2022-12-01
        expected: false
      - id: is-within-upcoming-month.valid.date-time.temporal.yesterday
        value: 2022-12-28
        expected: false
      - id: is-within-upcoming-month.valid.date-time.temporal.today
        value: 2022-12-29
        expected: false
      - id: is-within-upcoming-month.valid.date-time.temporal.tomorrow
        value: 2022-12-30
        expected: false
      - id: is-within-upcoming-month.valid.date-time.temporal.first-day-of-next-month
        value: 2023-01-01
        expected: true
      - id: is-within-upcoming-month.valid.date-time.temporal.last-day-of-next-month
        value: 2023-01-31
        expected: true
      - id: is-within-upcoming-month.valid.date-time.temporal.first-day-after-next-month
        value: 2023-02-01
        expected: false
      - id: is-within-upcoming-month.valid.date-time.temporal.epoch
        value: 1970-05-06
        expected: false
