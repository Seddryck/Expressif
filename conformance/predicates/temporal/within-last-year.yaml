suite: temporal
kind: predicate
operator: is-within-last-year
tests:
  - id: within-last-year.valid.date-time
    cases:
      - id: within-last-year.valid.date-time.temporal.last-day-of-two-years-ago
        value: 2020-12-31
        expected: false
      - id: within-last-year.valid.date-time.temporal.first-day-of-last-year
        value: 2021-01-01
        expected: true
      - id: within-last-year.valid.date-time.temporal.last-day-of-last-year
        value: 2021-12-31
        expected: true
      - id: within-last-year.valid.date-time.temporal.first-day-of-current-year
        value: 2022-01-01
        expected: false
      - id: within-last-year.valid.date-time.temporal.previous-month-in-current-year
        value: 2022-11-30
        expected: false
      - id: within-last-year.valid.date-time.temporal.current-month-in-current-year
        value: 2022-12-01
        expected: false
      - id: within-last-year.valid.date-time.temporal.yesterday-in-current-year
        value: 2022-12-30
        expected: false
      - id: within-last-year.valid.date-time.temporal.first-day-of-next-year
        value: 2023-01-01
        expected: false
