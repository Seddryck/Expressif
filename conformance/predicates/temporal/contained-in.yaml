suite: temporal
kind: predicate
operator: contained-in
tests:
  - id: contained-in.valid.date
    cases:
      - id: contained-in.valid.date.2022-11-21
        value: 2022-11-21
        expected: true
      - id: contained-in.valid.date.2022-11-25
        value: 2022-11-25
        expected: false
  - id: contained-in.valid.date-time
    cases:
      - id: contained-in.valid.date-time.in
        value: 2022-11-21 17:12:25
        expected: true
      - id: contained-in.valid.date-time.out
        value: 2022-11-25 17:12:25
        expected: false
      - id: contained-in.valid.special.empty
        value: (empty)
        expected: false
      - id: contained-in.valid.special.null
        value: (null)
        expected: false
