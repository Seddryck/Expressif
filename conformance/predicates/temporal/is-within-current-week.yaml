suite: temporal
kind: predicate
operator: is-within-current-week
tests:
  - id: is-within-current-week.valid.date-time
    cases:
      - id: is-within-current-week.valid.date-time.temporal.last-day-of-previous-week
        value: 2022-12-25
        expected: false
      - id: is-within-current-week.valid.date-time.temporal.yesterday-within-week
        value: 2022-12-28
        expected: true
      - id: is-within-current-week.valid.date-time.temporal.today
        value: 2022-12-29
        expected: true
      - id: is-within-current-week.valid.date-time.temporal.tomorrow-within-week
        value: 2022-12-30
        expected: true
      - id: is-within-current-week.valid.date-time.temporal.last-day-of-week
        value: 2023-01-01
        expected: true
      - id: is-within-current-week.valid.date-time.temporal.first-day-of-next-week
        value: 2023-01-02
        expected: false
      - id: is-within-current-week.valid.date-time.temporal.epoch
        value: 1970-05-06
        expected: false
