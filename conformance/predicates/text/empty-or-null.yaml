suite: text
kind: predicate
operator: empty-or-null
tests:
  - id: empty-or-null.valid
    cases:
      - id: empty-or-null.valid.special.null
        value: 
        expected: true
      - id: empty-or-null.valid.special.null-tag
        value: (null)
        expected: true
      - id: empty-or-null.valid.text.empty-string
        value: ""
        expected: true
      - id: empty-or-null.valid.special.empty
        value: (empty)
        expected: true
      - id: empty-or-null.valid.special.blank
        value: (blank)
        expected: false
      - id: empty-or-null.valid.text.foo
        value: foo
        expected: false
