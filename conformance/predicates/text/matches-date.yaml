suite: text
kind: predicate
operator: matches-date
tests:
  - id: matches-date.valid
    cases:
      - id: matches-date.valid.text.yyyy-mm-dd
        value: "2022-11-22"
        expected: true
      - id: matches-date.valid.text.yyyy-mm-d
        value: "2022-11-2"
        expected: false
      - id: matches-date.valid.text.yyyy-mm-dd-with-leading-zeros
        value: "2022-09-02"
        expected: true
      - id: matches-date.valid.text.yyyy-m-dd
        value: "2022-9-02"
        expected: false
      - id: matches-date.valid.text.dd-mm-yy
        value: "22-09-02"
        expected: false
      - id: matches-date.valid.text.yyyy-mm-dd-1900
        value: "1978-09-02"
        expected: true
      - id: matches-date.valid.text.dd-slash-mm-slash-yyyy
        value: "02/11/2022"
        expected: false
      - id: matches-date.valid.text.dd-dot-mm-dot-yyyy
        value: "02.11.2022"
        expected: false
      - id: matches-date.valid.numeric-decimal
        value: 1.21
        expected: false
      - id: matches-date.valid.text
        value: "foobar"
        expected: false
      - id: matches-date.valid.special.empty
        value: ""
        expected: false
      - id: matches-date.valid.special.empty-tag
        value: "(empty)"
        expected: false
      - id: matches-date.valid.special.null
        value: null
        expected: false
      - id: matches-date.valid.special.null-tag
        value: "(null)"
        expected: false
  - id: matches-date.valid.date
    cases:
      - id: matches-date.valid.date.after-2000
        value: "2022-11-22"
        expected: true
      - id: matches-date.valid.date.before-2000
        value: "1978-11-22"
        expected: true
  - id: matches-date.valid.date-time
    cases:
      - id: matches-date.valid.date-time.midnight
        value: 2022-11-22T00:00:00
        expected: true
      - id: matches-date.valid.date-time.random-time
        value: 2022-11-22T17:12:23
        expected: false
  - id: matches-date.valid.time
    cases:
      - id: matches-date.valid.time.morning
        value: "10:10:05"
        expected: false
  - id: matches-date.valid.culture-specific
    cases:
      - id: matches-date.valid.culture-specific.dutch.text.yyyy-mm-dd
        value: 2022-11-02
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.yyyy-m-dd
        value: 2022-11-2
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.yyyy-mm-dd-with-leading-zeros
        value: 2022-09-02
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.dd-mm-yyyy
        value: 02-11-2022
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.dd-slash-mm-slash-yyyy
        value: 22/11/2022
        expected: true
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.dd-slash-mm-slash-yyyy-with-leading-zeros
        value: 02/09/1978
        expected: true
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.d-slash-mm-slash-yyyy
        value: 2/11/2022
        expected: true
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.dd-slash-m-slash-yyyy
        value: 02/9/2022
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.d-slash-m-slash-yyyy
        value: 2/9/2022
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.dutch.text.dd-dot-mm-dot-yyyy-with-leading-zeros
        value: 02.11.2022
        expected: false
        parameters:
          - nl-be
      - id: matches-date.valid.culture-specific.french.text.yyyy-mm-dd
        value: 2022-11-02
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.yyyy-m-dd
        value: 2022-11-2
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.yyyy-mm-dd-with-leading-zeros
        value: 2022-09-02
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.dd-mm-yyyy
        value: 02-11-2022
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.dd-slash-mm-slash-yyyy
        value: 02/11/2022
        expected: true
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.dd-slash-mm-slash-yyyy-with-leading-zeros
        value: 20/09/1978
        expected: true
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.d-slash-mm-slash-yyyy
        value: 2/11/2022
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.dd-slash-m-slash-yyyy
        value: 02/9/2022
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.dd-dot-mm-dot-yyyy
        value: 02.11.2022
        expected: false
        parameters:
          - fr-fr
      - id: matches-date.valid.culture-specific.french.text.decimal-value
        value: 1.21
        expected: false
        parameters:
          - fr-fr
