suite: text
kind: predicate
operator: matches-numeric
tests:
  - id: matches-numeric.valid
    cases:
      - id: matches-numeric.valid.text.integer-value
        value: 121
        expected: true
      - id: matches-numeric.valid.text.positive-decimal-value
        value: 1.21
        expected: true
      - id: matches-numeric.valid.text.positive-decimal-value-thousand
        value: 1000.21
        expected: true
      - id: matches-numeric.valid.text.negative-decimal-value-thousand
        value: -1000.21
        expected: true
      - id: matches-numeric.valid.text.positive-decimal-value-thousand-separator
        value: 52,000.21
        expected: false
      - id: matches-numeric.valid.text.positive-decimal-with-comma-as-decimal-separator
        value: 1000,21
        expected: false
      - id: matches-numeric.valid.text.positive-decimal-with-comma-as-decimal-separator-and-dot-as-thousand-separator 
        value: 52.000,21
        expected: false
      - id: matches-numeric.valid.text.currency-value
        value: $20
        expected: false
      - id: matches-numeric.valid.text.starting-with-letter-and-dot
        value: A.1
        expected: false
      - id: matches-numeric.valid.text.starting-with-letter
        value: A121
        expected: false
      - id: matches-numeric.valid.text.ending-with-non-numeric-character
        value: 1!
        expected: false
      - id: matches-numeric.valid.text.ending-with-letter
        value: 121A
        expected: false
  - id: matches-numeric.valid.culture-specific
    cases:
      - id: matches-numeric.valid.culture-specific.french.text.positive-integer-value
        value: "121"
        expected: true
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.positive-decimal-value-and-dot-as-decimal-separator
        value: "1.21"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.positive-decimal-value-and-dot-as-decimal-separator-thousand
        value: "1000.21"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.negative-decimal-value-and-dot-as-decimal-separator-thousand
        value: "-1000.21"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.positive-decimal-value-and-dot-as-decimal-separator-and-comma-as-thousand-separator
        value: "52,000.21"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.positive-decimal-value-and-comma-as-decimal-separator
        value: "1000,21"
        expected: true
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.positive-decimal-value-and-comma-as-decimal-separator-and-dot-as-thousand-separator
        value: "52.000,21"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.currency-value
        value: "$20"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.starting-with-letter-and-dot
        value: "A.1"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.starting-with-letter
        value: "A121"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.ending-with-non-numeric-character
        value: "1!"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.text.ending-with-letter
        value: "121A"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.special.empty-tag
        value: "(empty)"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.special.empty
        value: ''
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.special.null-tag
        value: "(null)"
        expected: false
        parameters:
          - fr-fr
      - id: matches-numeric.valid.culture-specific.french.special.null
        value: null
        expected: false
        parameters:
          - fr-fr
