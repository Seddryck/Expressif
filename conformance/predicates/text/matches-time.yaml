suite: text
kind: predicate
operator: matches-time
tests:
  - id: matches-time.valid
    cases:
      - id: matches-time.valid.text.invariant-format
        value: "13:57:00"
        expected: true
      - id: matches-time.valid.text.invariant-format-with-date
        value: "2022-12-16 13:57:00"
        expected: false
      - id: matches-time.valid.text.invariant-format-date-only
        value: "2022-12-16"
        expected: false
      - id: matches-time.valid.text.invariant-format-with-milliseconds
        value: "13:57:00.123"
        expected: false
      - id: matches-time.valid.text.invariant-format-with-PM
        value: "1:52PM"
        expected: false
      - id: matches-time.valid.text.invariant-format-in-1900s
        value: "1978-09-02 13:57:00"
        expected: false
      - id: matches-time.valid.text.numeric-decimal
        value: "1.21"
        expected: false
      - id: matches-time.valid.numeric
        value: 1.21
        expected: false
      - id: matches-time.valid.text
        value: foobar
        expected: false
      - id: matches-time.valid.special.empty-tag
        value: (empty)
        expected: false
      - id: matches-time.valid.special.empty
        value: ''
        expected: false
      - id: matches-time.valid.special.null-tag
        value: (null)
        expected: false
      - id: matches-time.valid.special.null
        value: null
        expected: false
  - id: matches-time.valid.time
    cases:
      - id: matches-time.valid.time
        value: "13:57:00"
        expected: true
  - id: matches-time.valid.date
    cases:
      - id: matches-time.valid.date
        value: "2025-12-16"
        expected: false
  - id: matches-time.valid.date-time
    cases:
      - id: matches-time.valid.date-time-date-part
        value: "2022-12-26"
        expected: false
      - id: matches-time.valid.full-date-time
        value: "2022-12-26T13:57:00"
        expected: false
  - id: matches-time.valid.time-span
    cases:
      - id: matches-time.valid.time-span.less-than-24-hours
        value: "15:12:17"
        expected: true
      - id: matches-time.valid.time-span.more-than-24-hours
        value: "42:12:10"
        expected: false
      - id: matches-time.valid.time-span.more-than-24-hours-with-days
        value: "1.18:12:10"
        expected: false
  - id: matches-time.valid.culture-specific
    cases:
      - id: matches-time.valid.culture-specific.english-culture.invariant-format-with-PM
        value: "13:12:23PM"
        expected: false
        parameters:
          - en-GB
      - id: matches-time.valid.culture-specific.english-culture.invariant-format
        value: "13:12:23"
        expected: true
        parameters:
          - en-GB
