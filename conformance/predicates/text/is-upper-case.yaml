suite: text
kind: predicate
operator: is-upper-case
tests:
  - id: is-upper-case.valid.text
    cases:
      - id: is-upper-case.valid.text.first-letter-upper
        value: Foobar
        expected: false
      - id: is-upper-case.valid.text.full-lower
        value: foobar
        expected: false
      - id: is-upper-case.valid.text.full-upper
        value: FOOBAR
        expected: true
      - id: is-upper-case.valid.text.word-casing
        value: Foo Bar
        expected: false
      - id: is-upper-case.valid.text.full-lower-with-space
        value: foo bar
        expected: false
      - id: is-upper-case.valid.text.full-upper-with-space
        value: FOO BAR
        expected: true
      - id: is-upper-case.valid.text.empty
        value: ''
        expected: true
      - id: is-upper-case.valid.special.empty-tag
        value: (empty)
        expected: true
      - id: is-upper-case.valid.special.null
        value: (null)
        expected: true
