suite: text
kind: predicate
operator: is-any-of
tests:
  - id: any-of.valid.text
    cases:
      - id: any-of.valid.text.array.foo-bar
        value: foo
        expected: true
        parameters:
          - [foo, bar]
      - id: any-of.valid.text.array.foo
        value: foo
        expected: false
        parameters:
          - [bar]
      - id: any-of.valid.empty-tag.array.with-empty
        value: (empty)
        expected: true
        parameters:
          - ["foo", "bar", ""]
      - id: any-of.valid.empty-tag.array.without-empty
        value: (empty)
        expected: false
        parameters:
          - ["foo", "bar"]
      - id: any-of.valid.empty.array.with-empty-tag
        value: ""
        expected: true
        parameters:
          - [foo, bar, (empty)]
      - id: any-of.valid.empty.array.without-empty-tag
        value: ""
        expected: false
        parameters:
          - ["foo", "bar"]

