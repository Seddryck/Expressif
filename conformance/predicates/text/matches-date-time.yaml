suite: text
kind: predicate
operator: matches-date-time
tests:
  - id: matches-date-time.valid
    cases:
      - id: matches-date-time.valid.text.invariant-format
        value: "2022-11-02 13:57:00"
        expected: true
      - id: matches-date-time.valid.text.invariant-format-with-milliseconds
        value: "2022-11-02 13:57:00.123"
        expected: false
      - id: matches-date-time.valid.text.invariant-format-with-PM
        value: "2022-11-02 1:52PM"
        expected: false
      - id: matches-date-time.valid.text.date-format
        value: "1978-09-02"
        expected: false
      - id: matches-date-time.valid.text.invariant-format-in-1900s
        value: "1978-09-02 13:57:00"
        expected: true
      - id: matches-date-time.valid.text.numeric-decimal
        value: "1.21"
        expected: false
      - id: matches-date-time.valid.numeric
        value: 1.21
        expected: false
      - id: matches-date-time.valid.text
        value: foobar
        expected: false
      - id: matches-date-time.valid.special.empty-tag
        value: (empty)
        expected: false
      - id: matches-date-time.valid.special.empty
        value: ''
        expected: false
      - id: matches-date-time.valid.special.null-tag
        value: (null)
        expected: false
      - id: matches-date-time.valid.special.null
        value: null
        expected: false
  - id: matches-date-time.valid.date-time
    cases:
      - id: matches-date-time.valid.date-time
        value: 2022-11-02T13:57:00
        expected: true
  - id: matches-date-time.valid.culture-specific
    cases:
      - id: matches-date-time.valid.culture-specific.american-culture.text.french-format
        value: "25/12/2025 10:01:55"
        expected: false
        parameters:
          - en-US
      - id: matches-date-time.valid.culture-specific.french-culture.text.french-format
        value: "25/12/2025 10:01:55"
        expected: true
        parameters:
          - fr-FR
      - id: matches-date-time.valid.culture-specific.american-culture.text.dutch-format
        value: "02-11-2022 13:57:00"
        expected: false
        parameters:
          - en-US
      - id: matches-date-time.valid.culture-specific.dutch-culture.text.dutch-format
        value: "02-11-2022 13:57:00"
        expected: true
        parameters:
          - nl-NL
      - id: matches-date-time.valid.culture-specific.american-culture.text.japanese-format
        value: "11/2/2022 03:57:00"
        expected: false
        parameters:
          - en-US
      - id: matches-date-time.valid.culture-specific.japanese-culture.text.japanese-format
        value: "11/2/2022 03:57:00"
        expected: true
        parameters:
          - jp-JP
      - id: matches-date-time.valid.culture-specific.american-culture.text.german-format
        value: "02.11.2022 03:57:00"
        expected: false
        parameters:
          - en-US
      - id: matches-date-time.valid.culture-specific.german-culture.text.german-format
        value: "02.11.2022 03:57:00"
        expected: true
        parameters:
          - de-DE