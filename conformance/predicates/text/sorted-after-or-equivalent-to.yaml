suite: text
kind: predicate
operator: sorted-after-or-equivalent-to
tests:
  - id: sorted-after-or-equivalent-to.valid
    cases:
      - id: sorted-after-or-equivalent-to.valid.text.same
        value: A
        expected: true
        parameters:
          - A
      - id: sorted-after-or-equivalent-to.valid.text.before
        value: A
        expected: false
        parameters:
          - B
      - id: sorted-after-or-equivalent-to.valid.text.after
        value: B
        expected: true
        parameters:
          - A
      - id: sorted-after-or-equivalent-to.valid.empty-string.special.empty
        value: ""
        expected: true
        parameters:
          - (empty)
      - id: sorted-after-or-equivalent-to.valid.string.special.empty
        value: A
        expected: true
        parameters:
          - (empty)
      - id: sorted-after-or-equivalent-to.valid.null.special.null
        value: (null)
        expected: true
        parameters:
          - (null)