suite: exists
kind: predicate
operator: exists
tests:
  - id: exists.array
    cases:
      - id: exists.array.shared-key
        value: (null)
        parameters: ['{id := 2} | exists({{id := 1}, {id := 2}}, .id)']
        expected: true
      - id: exists.array.distinct-keys
        value: (null)
        parameters: ['{id := 2} | exists({{customer-id := 2}}, .id, .customer-id)']
        expected: true
      - id: exists.array.missing
        value: (null)
        parameters: ['2 | exists({1, 3}, @_)']
        expected: false
      - id: exists.array.empty
        value: (null)
        parameters: ['2 | exists({}, @_)']
        expected: false
      - id: exists.array.null-key
        value: (null)
        parameters: ['#null | exists({#null}, @_)']
        expected: true
      - id: exists.array.structural-key
        value: (null)
        parameters: ['T(1, "BE") | exists({T(2, "BE"), T(1, "BE")}, @_)']
        expected: true
      - id: exists.array.named
        value: (null)
        parameters: ['{id := 2} | exists(right-key := .customer-id, right := {{customer-id := 2}}, left-key := .id)']
        expected: true
  - id: exists.grouping
    cases:
      - id: exists.grouping.empty-bucket
        value: (null)
        parameters: ['1 | exists(#{(1 => {})}, @_)']
        expected: true
      - id: exists.grouping.missing
        value: (null)
        parameters: ['2 | exists(#{(1 => {2})}, @_)']
        expected: false
      - id: exists.grouping.empty
        value: (null)
        parameters: ['1 | exists(#{}, @_)']
        expected: false
      - id: exists.grouping.group-by
        value: (null)
        parameters: ['{id := 1} | exists({{customer-id := 1}} | group-by(.customer-id), .id)']
        expected: true
