suite: array
kind: predicate
operator: all
tests:
  - id: all.valid.predicate
    cases:
      - id: all.valid.predicate.array.every-match
        value: "{1,2,3}"
        expected: true
        parameters:
          - greater-than(0)
      - id: all.valid.predicate.array.one-non-match
        value: "{1,2,3}"
        expected: false
        parameters:
          - greater-than(1)
      - id: all.valid.predicate.array.single-match
        value: "{2}"
        expected: true
        parameters:
          - even
      - id: all.valid.predicate.array.empty
        value: "{}"
        expected: true
        parameters:
          - even
      - id: all.valid.predicate.special.null
        value: (null)
        expected: false
        parameters:
          - even
      - id: all.valid.predicate.special.empty
        value: (empty)
        expected: false
        parameters:
          - even
