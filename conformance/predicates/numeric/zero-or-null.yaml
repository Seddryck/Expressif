suite: numeric
kind: predicate
operator: zero-or-null
tests:
  - id: zero-or-null.valid
    cases:
      - id: zero-or-null.valid.numeric.zero
        value: 0
        expected: true
      - id: zero-or-null.valid.numeric.one
        value: 1
        expected: false
      - id: zero-or-null.valid.numeric.positive
        value: 4
        expected: false
      - id: zero-or-null.valid.numeric.negative
        value: -4
        expected: false
      - id: zero-or-null.valid.special.empty
        value: 
        expected: true
      - id: zero-or-null.valid.special.null
        value: (null)
        expected: true
      - id: zero-or-null.valid.special.blank
        value: (blank)
        expected: true