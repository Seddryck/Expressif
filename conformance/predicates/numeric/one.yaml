suite: numeric
kind: predicate
operator: one
tests:
  - id: one.valid
    cases:
      - id: one.valid.numeric.zero
        value: 0
        expected: false
      - id: one.valid.numeric.one
        value: 1
        expected: true
      - id: one.valid.numeric.ten
        value: 10
        expected: false
      - id: one.valid.numeric.minus-ten
        value: -10
        expected: false
      - id: one.valid.special.empty-tag
        value: (empty)
        expected: false
      - id: one.valid.special.blank
        value: (blank)
        expected: false
      - id: one.valid.special.null
        value: (null)
        expected: false
