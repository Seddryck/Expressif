suite: numeric
kind: predicate
operator: is-modulo
tests:
  - id: modulo.valid
    cases:
      - id: modulo.valid.integer.no-remainder.success
        value: 10
        expected: true
        parameters:
          - 5
          - 0
      - id: modulo.valid.integer.no-remainder.failure
        value: 10
        expected: false
        parameters:
          - 6
          - 0
      - id: modulo.valid.integer.with-remainder.success
        value: 10
        expected: true
        parameters:
          - 4
          - 2
      - id: modulo.valid.integer.with-remainder.failure
        value: 10
        expected: false
        parameters:
          - 4
          - 3
      - id: modulo.valid.special.null
        value: null
        expected: false
        parameters:
          - 4
          - 3
