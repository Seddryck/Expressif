suite: numeric
kind: predicate
operator: has-remainder
tests:
  - id: has-remainder.valid
    cases:
      - id: has-remainder.valid.integer.no-remainder.success
        value: 10
        expected: true
        parameters:
          - 5
          - 0
      - id: has-remainder.valid.integer.no-remainder.failure
        value: 10
        expected: false
        parameters:
          - 6
          - 0
      - id: has-remainder.valid.integer.with-remainder.success
        value: 10
        expected: true
        parameters:
          - 4
          - 2
      - id: has-remainder.valid.integer.with-remainder.failure
        value: 10
        expected: false
        parameters:
          - 4
          - 3
      - id: has-remainder.valid.special.null
        value: (null)
        expected: false
        parameters:
          - 4
          - 3
      - id: has-remainder.valid.special.empty
        value: (empty)
        expected: false
        parameters:
          - 4
          - 3
