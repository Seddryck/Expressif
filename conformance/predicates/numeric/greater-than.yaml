suite: numeric
kind: predicate
operator: is-greater-than
tests:
  - id: greater-than.valid
    cases:
      - id: greater-than.valid.numeric.equal
        value: 10
        expected: false
        parameters:
          - 10
      - id: greater-than.valid.numeric.less-than
        value: 4
        expected: false
        parameters:
          - 10
      - id: greater-than.valid.numeric.more-than
        value: 15
        expected: true
        parameters:
          - 10
      - id: greater-than.valid.numeric.less-than-decimal
        value: 9.999
        expected: false
        parameters:
          - 10
      - id: greater-than.valid.numeric.more-than-decimal
        value: 10.001
        expected: true
        parameters:
          - 10
      - id: greater-than.valid.special.null
        value: (null)
        expected: false
        parameters:
          - 10
      - id: greater-than.valid.special.empty-tag
        value: (empty)
        expected: false
        parameters:
          - 10
      - id: greater-than.valid.special.blank
        value: (blank)
        expected: false
        parameters:
          - 10
