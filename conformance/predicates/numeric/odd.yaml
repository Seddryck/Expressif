suite: numeric
kind: predicate
operator: is-odd
tests:
  - id: odd.valid
    cases:
      - id: odd.valid.numeric.positive.even
        value: 10
        expected: false
      - id: odd.valid.numeric.positive.odd
        value: 11
        expected: true
      - id: odd.valid.numeric.one
        value: 1
        expected: true
      - id: odd.valid.numeric.zero
        value: 0
        expected: false
      - id: odd.valid.special.empty
        value: 
        expected: false
