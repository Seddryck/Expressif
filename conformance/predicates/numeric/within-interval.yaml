     - id: within-interval.valid.open-closed.integer.inside
       value: 10
       expected: true
     - id: within-interval.valid.open-closed.integer.on-edge.outside
       value: 1
       expected: false
     - id: within-interval.valid.open-closed.integer.on-edge.inside
       value: 12
       expected: true
     - id: within-interval.valid.open-closed.valid.special.null
       value: 

