suite: numeric
kind: predicate
operator: is-zero
tests:
  - id: zero.valid
    cases:
      - id: zero.valid.numeric.zero
        value: 0
        expected: true
      - id: zero.valid.numeric.one
        value: 1
        expected: false
      - id: zero.valid.numeric.positive
        value: 10
        expected: false
      - id: zero.valid.numeric.negative
        value: -10
        expected: false
      - id: zero.valid.special.empty
        value: 
        expected: false
      - id: zero.valid.special.blank
        value: (blank)
        expected: false
      - id: zero.valid.special.null
        value: (null)
        expected: false
