suite: numeric
kind: predicate
operator: is-negative-or-zero
tests:
  - id: is-negative-or-zero.valid
    cases:
      - id: is-negative-or-zero.valid.integer.zero
        value: 0
        expected: true
      - id: is-negative-or-zero.valid.integer.one
        value: 1
        expected: false
      - id: is-negative-or-zero.valid.integer.positive
        value: 10
        expected: false
      - id: is-negative-or-zero.valid.integer.negative
        value: -10
        expected: true
      - id: is-negative-or-zero.valid.numeric.positive-decimal
        value: 10.001
        expected: false
      - id: is-negative-or-zero.valid.numeric.negative-decimal
        value: -10.001
        expected: true
      - id: is-negative-or-zero.valid.special.empty-tag
        value: (empty)
        expected: false
      - id: is-negative-or-zero.valid.special.null
        value: (null)
        expected: false
      - id: is-negative-or-zero.valid.special.blank
        value: (blank)
        expected: false
