suite: boolean
kind: predicate
operator: or
tests:
  - id: or.valid.expression
    cases:
      - id: or.valid.expression.boolean.false-false
        value: false
        expected: false
        parameters:
          - false
      - id: or.valid.expression.boolean.false-true
        value: false
        expected: true
        parameters:
          - true
      - id: or.valid.expression.boolean.true-false
        value: true
        expected: true
        parameters:
          - false
      - id: or.valid.expression.boolean.true-true
        value: true
        expected: true
        parameters:
          - true
      - id: or.valid.expression.boolean.true-null
        value: true
        expected: true
        parameters:
          - null
      - id: or.valid.expression.boolean.false-null
        value: false
        expected: false
        parameters:
          - null
      - id: or.valid.expression.special.null
        value: (null)
        expected: true
        parameters:
          - true
      - id: or.valid.expression.special.empty
        value: (empty)
        expected: true
        parameters:
          - true
      - id: or.valid.expression.parameter-integer.zero
        value: false
        expected: false
        parameters:
          - 0
      - id: or.valid.expression.parameter-integer.nonzero
        value: false
        expected: true
        parameters:
          - 2
      - id: or.valid.expression.text.yes
        value: yes
        expected: true
        parameters:
          - false
      - id: or.valid.expression.text.unconvertible
        value: foo
        expected: false
        parameters:
          - false
