suite: boolean
kind: predicate
operator: identical-to
tests:
  - id: identical-to.valid
    cases:
    - id: identical-to.valid.true.boolean.true
      value: true
      expected: true
      parameters:
        - true
    - id: identical-to.valid.true.boolean.false
      value: false
      expected: false
      parameters:
        - true
    - id: identical-to.valid.true.special.empty
      value: 
      expected: false
      parameters:
        - true
    - id: identical-to.valid.true.special.null
      value: (null)
      expected: false
      parameters:
        - true
    - id: identical-to.valid.true.integer.minus-one
      value: -1
      expected: true
      parameters:
        - true
    - id: identical-to.valid.true.integer.zero
      value: 0
      expected: false
      parameters:
        - true
    - id: identical-to.valid.true.integer.one
      value: 1
      expected: true
      parameters:
        - true
    - id: identical-to.valid.true.positive-decimal
      value: 104.25
      expected: true
      parameters:
        - true
    - id: identical-to.valid.true.boolean.yes
      value: yes
      expected: true
      parameters:
        - true
    - id: identical-to.valid.true.boolean.no
      value: no
      expected: false
      parameters:
        - true
    - id: identical-to.valid.false.boolean.true
      value: true
      expected: false
      parameters:
        - false
    - id: identical-to.valid.false.boolean.false
      value: false
      expected: true
      parameters:
        - false
    - id: identical-to.valid.special.false.empty
      value: 
      expected: false
      parameters:
        - false
    - id: identical-to.valid.special.false.null
      value: (null)
      expected: false
      parameters:
        - false
    - id: identical-to.valid.false.integer.minus-one
      value: -1
      expected: false
      parameters:
        - false
    - id: identical-to.valid.false.integer.zero
      value: 0
      expected: true
      parameters:
        - false
    - id: identical-to.valid.false.integer.one
      value: 1
      expected: false
      parameters:
        - false
    - id: identical-to.valid.false.numeric.positive-decimal
      value: 104.25
      expected: false
      parameters:
        - false
    - id: identical-to.valid.false.boolean.yes
      value: yes
      expected: false
      parameters:
        - false
    - id: identical-to.valid.false.boolean.no
      value: no
      expected: true
      parameters:
        - false
