suite: record
kind: function
operator: with
tests:
  - id: with.valid.text
    cases:
      - id: with.valid.text.same-input
        value: { firstName: John, lastName: Doe }
        parameters:
          - 'with(last-name := .lastName, first-name := .firstName, .last-name | suffix(", ") | suffix(.first-name))'
        expected: Doe, John
      - id: with.valid.text.independent
        value: { name: Alice }
        parameters:
          - 'with(name := .name | upper, original := .name, .name | suffix(" / ") | suffix(.original))'
        expected: ALICE / Alice
      - id: with.valid.text.nested
        value: { firstName: John, lastName: Doe }
        parameters:
          - 'with(person := record(first := .firstName, last := .lastName), with(first := .person | field(first), last := .person | field(last), .first | suffix(" ") | suffix(.last)))'
        expected: John Doe
  - id: with.valid.numeric
    cases:
      - id: with.valid.numeric.pipeline
        value: { price: 12.5, quantity: 4 }
        parameters:
          - 'with(price := .price, quantity := .quantity, .price | multiply(.quantity))'
        expected: 50
      - id: with.valid.numeric.reused
        value: { price: 5 }
        parameters:
          - 'with(price := .price, .price | add(.price))'
        expected: 10
