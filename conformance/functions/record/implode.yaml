suite: record
kind: function
operator: implode
tests:
- id: implode.valid.rows
  cases:
  - id: implode.valid.rows.empty
    value: null
    parameters:
    - '{} | implode(.tags)'
    expected: '{}'
  - id: implode.valid.rows.single
    value: null
    parameters:
    - '{{id := 1, tags := "A"}} | implode(.tags)'
    expected: '{{id := 1, tags := {"A"}}}'
  - id: implode.valid.rows.null
    value: null
    parameters:
    - '{{id := 1, tags := #null}} | implode(.tags)'
    expected: '{{id := 1, tags := {null}}}'
  - id: implode.valid.rows.mixed
    value: null
    parameters:
    - '{{id := 1, tags := "A"}, {id := 1, tags := #null}, {id := 1, tags := "B"}} | implode(.tags)'
    expected: '{{id := 1, tags := {"A", null, "B"}}}'
  - id: implode.valid.rows.duplicates-order
    value: null
    parameters:
    - '{{id := 2, tags := "B", tail := 9}, {id := 1, tags := "A", tail := 9}, {id := 2, tags := "B", tail := 9}, {id := 1, tags := "C", tail := 9}} | implode(.tags)'
    expected: '{{id := 2, tags := {"B", "B"}, tail := 9}, {id := 1, tags := {"A", "C"}, tail := 9}}'
  - id: implode.valid.rows.complete-parent
    value: null
    parameters:
    - '{{id := 1, kind := "x", tags := "A"}, {id := 1, kind := "y", tags := "B"}} | implode(.tags)'
    expected: '{{id := 1, kind := "x", tags := {"A"}}, {id := 1, kind := "y", tags := {"B"}}}'
  - id: implode.valid.rows.nested-parent
    value: null
    parameters:
    - '{{parent := {id := 1, nested := {1, 2}}, tags := "A"}, {parent := {id := 1, nested := {1, 2}}, tags := "B"}, {parent := {id := 1, nested := {2, 1}}, tags := "C"}} | implode(.tags)'
    expected: '{{parent := {id := 1, nested := {1, 2}}, tags := {"A", "B"}}, {parent := {id := 1, nested := {2, 1}}, tags := {"C"}}}'
  - id: implode.valid.rows.nested-child
    value: null
    parameters:
    - '{{id := 1, tags := {"A", "B"}}, {id := 1, tags := {"C"}}} | implode(.tags)'
    expected: '{{id := 1, tags := {{"A", "B"}, {"C"}}}}'
  - id: implode.valid.rows.missing
    value: null
    parameters:
    - '{{id := 1}} | implode(.tags)'
    expected: '{{id := 1, tags := {null}}}'
  - id: implode.valid.rows.named
    value: null
    parameters:
    - '{{tags := "A"}} | implode(selector := .tags)'
    expected: '{{tags := {"A"}}}'
  - id: implode.valid.rows.round-trip
    value: null
    parameters:
    - '{id := 1, tags := {"A", "B"}} | explode(.tags) | implode(.tags)'
    expected: '{{id := 1, tags := {"A", "B"}}}'
- id: implode.valid.null
  cases:
  - id: implode.valid.null.input
    value: null
    parameters:
    - '#null | implode(.tags)'
    expected: null
