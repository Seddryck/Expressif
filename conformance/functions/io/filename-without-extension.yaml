suite: io
kind: function
operator: filename-without-extension
tests:
  - id: filename-without-extension.valid
    cases:
      - id: filename-without-extension.valid.io.drive-c
        value: C:\
        expected: ''
      - id: filename-without-extension.valid.io.drive-c-dir
        value: C:\Dir\
        expected: ''
      - id: filename-without-extension.valid.io.drive-c-dir-child
        value: C:\Dir\Child\
        expected: ''
      - id: filename-without-extension.valid.io.drive-c-dir-childfile
        value: C:\Dir\ChildFile
        expected: ChildFile
      - id: filename-without-extension.valid.io.drive-c-dir-child-file-txt
        value: C:\Dir\Child\file.txt
        expected: file
      - id: filename-without-extension.valid.io.dir-file-txt
        value: Dir\file.txt
        expected: file
      - id: filename-without-extension.valid.special.null
        value: (null)
        expected: (empty)
      - id: filename-without-extension.valid.special.empty
        value: (empty)
        expected: (empty)
      - id: filename-without-extension.valid.special.blank
        value: (blank)
        expected: (empty)
