suite: pivot
kind: function
operator: pivot
tests:
  - id: pivot.valid.records
    cases:
      - id: pivot.valid.records.sales
        value: (null)
        parameters: ['{{country := "BE", year := 2025, amount := 30}, {country := "BE", year := 2025, amount := 70}, {country := "BE", year := 2026, amount := 120}, {country := "FR", year := 2025, amount := 80}, {country := "FR", year := 2026, amount := 90}} | pivot(.country, .year, summarize(|> .amount | sum))']
        expected: '{{country := "BE", 2025 := 100, 2026 := 120}, {country := "FR", 2025 := 80, 2026 := 90}}'
      - id: pivot.valid.records.sparse.order
        value: (null)
        parameters: ['{{r := "FR", c := "b"}, {r := "BE", c := "a"}, {r := "FR", c := "a"}, {r := "FR", c := "b"}} | pivot(.r, .c, summarize(cardinality))']
        expected: '{{r := "FR", b := 2, a := 1}, {r := "BE", a := 1}}'
      - id: pivot.valid.records.named
        value: (null)
        parameters: ['{{r := "BE", c := "a", v := 3}} | pivot(summary := summarize(|> .v | first), column := .c, row := .r)']
        expected: '{{r := "BE", a := 3}}'
      - id: pivot.valid.records.against
        value: (null)
        parameters: ['{{r := "BE", c := "a", v := 2}, {r := "BE", c := "b", v := 4}} | pivot(.r, .c, summarize-against(count, count, divide~))']
        expected: '{{r := "BE", a := 0.5, b := 0.5}}'
      - id: pivot.valid.records.custom.dictionary.order
        value: (null)
        parameters: ['{{r := "BE", c := "a"}, {r := "FR", c := "b"}} | pivot(.r, .c, !{(T("FR", "b") => 42), (T("BE", "a") => #null)})']
        expected: '{{r := "FR", b := 42}, {r := "BE", a := null}}'
      - id: pivot.valid.records.two.dimensions
        value: (null)
        parameters: ['{{country := "BE", category := "Retail", year := 2025, amount := 30}, {country := "BE", category := "Retail", year := 2025, amount := 70}, {country := "BE", category := "Industry", year := 2026, amount := 250}, {country := "FR", category := "Retail", year := 2025, amount := 80}} | pivot(T(.country, .category), .year, summarize(|> .amount | sum))']
        expected: '{{country := "BE", category := "Retail", 2025 := 100}, {country := "BE", category := "Industry", 2026 := 250}, {country := "FR", category := "Retail", 2025 := 80}}'
      - id: pivot.valid.records.three.dimensions
        value: (null)
        parameters: ['{{a := 1, b := 2, d := 3, c := "x"}, {a := 1, b := 2, d := 4, c := "y"}, {a := 1, b := 2, d := 3, c := "x"}} | pivot(T(.a, .b, .d), .c, summarize(cardinality))']
        expected: '{{a := 1, b := 2, d := 3, x := 2}, {a := 1, b := 2, d := 4, y := 1}}'
      - id: pivot.valid.records.array.key
        value: (null)
        parameters: ['{{r := {1, 2}, c := "a"}, {r := {1, 2}, c := "a"}, {r := {2, 1}, c := "b"}} | pivot(.r, .c, summarize(cardinality))']
        expected: '{{r := {1, 2}, a := 2}, {r := {2, 1}, b := 1}}'
      - id: pivot.valid.records.record.key
        value: (null)
        parameters: ['{{r := {id := 1}, c := "a"}, {r := {id := 1}, c := "a"}} | pivot(.r, .c, summarize(cardinality))']
        expected: '{{r := {id := 1}, a := 2}}'
      - id: pivot.valid.records.flattened.keys
        value: (null)
        parameters: ['{{a := 1, b := 2, c := "x"}} | pivot(T(.a, .b), .c, !{(T(1, 2, "x") => 42)})']
        expected: '{{a := 1, b := 2, x := 42}}'
      - id: pivot.valid.records.tuple.array.key
        value: (null)
        parameters: ['{{a := {1, 2}, b := #null, c := "x"}, {a := {1, 2}, b := #null, c := "x"}} | pivot(T(.a, .b), .c, summarize(cardinality))']
        expected: '{{a := {1, 2}, b := null, x := 2}}'
  - id: pivot.valid.empty
    cases:
      - id: pivot.valid.empty.array
        value: (null)
        parameters: ['{} | pivot(.r, .c, summarize(cardinality))']
        expected: '{}'

      - id: pivot.valid.empty.tuple
        value: (null)
        parameters: ['{} | pivot(T(.a, .b), .c, summarize(cardinality))']
        expected: '{}'
