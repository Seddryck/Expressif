suite: array
kind: function
operator: chunk-while
tests:
  - id: chunk-while.valid.operation
    cases:
      - id: chunk-while.valid.operation.numeric-gaps
        value: '{10, 20, 21, 22, 23, 24, 30, 31, 32, 40, 41}'
        parameters: ['$1 | subtract($0 | last) | is-less-than(2)']
        expected: '{{10}, {20, 21, 22, 23, 24}, {30, 31, 32}, {40, 41}}'
      - {id: chunk-while.valid.operation.always-true, value: '{1, 2, 3}', parameters: ['$1 | is-less-than(4)'], expected: '{{1, 2, 3}}'}
      - {id: chunk-while.valid.operation.always-false, value: '{1, 2, 3}', parameters: ['$1 | is-greater-than(4)'], expected: '{{1}, {2}, {3}}'}
      - {id: chunk-while.valid.operation.empty, value: '{}', parameters: [greater-than], expected: '{}'}
      - {id: chunk-while.valid.operation.singleton, value: '{10}', parameters: [greater-than], expected: '{{10}}'}
      - {id: chunk-while.valid.operation.chunk-size, value: '{1, 2, 3, 4, 5, 6, 7}', parameters: ['$0 | cardinality | less-than(3)'], expected: '{{1, 2, 3}, {4, 5, 6}, {7}}'}
      - {id: chunk-while.valid.operation.chunk-sum, value: '{4, 5, 3, 7, 2}', parameters: ['$0 | sum | add($1) | less-than(11)'], expected: '{{4, 5}, {3, 7}, {2}}'}
      - {id: chunk-while.valid.operation.last-distance, value: '{1, 3, 5, 10, 11}', parameters: ['$1 | subtract($0 | last) | absolute | less-than(3)'], expected: '{{1, 3, 5}, {10, 11}}'}
      - {id: chunk-while.valid.operation.all-distances, value: '{1, 3, 5, 10, 11}', parameters: ['@_ | pair :> $0 | filter(subtract(@pair | $1) | absolute | greater-than(2)) | cardinality | equal-to(0)'], expected: '{{1, 3}, {5}, {10, 11}}'}
      - {id: chunk-while.valid.operation.null-and-structured, value: '{#null, {x := 1}, {2, 3}, T(4, 5), #null}', parameters: ['$0 | cardinality | less-than(3)'], expected: '{{null, {x := 1}, {2, 3}}, {T(4, 5), null}}'}
      - {id: chunk-while.valid.operation.consecutive-boundaries, value: '{20, 30, 1, 2}', parameters: ['$0 | sum | add($1) | less-than(10)'], expected: '{{20}, {30}, {1, 2}}'}
      - {id: chunk-while.valid.operation.non-boolean, value: '{1, 2, 3}', parameters: ['$0 | cardinality'], expected: }
      - {id: chunk-while.valid.operation.unsupported-number, value: 42, parameters: ['$0 | cardinality'], expected: }
      - {id: chunk-while.valid.operation.unsupported-text, value: '"hello"', parameters: ['$0 | cardinality'], expected: }
      - id: chunk-while.valid.operation.special-null
        value: (null)
        parameters: [greater-than]
        expected:

  - id: chunk-while.explicit-binding
    cases:
      - id: chunk-while.explicit-binding.direction
        value: "{1, 2, 5}"
        parameters: ['chunk-while($1 | subtract($0 | last) | less-than(2))']
        expected: '{{1, 2}, {5}}'
