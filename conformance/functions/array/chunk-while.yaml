suite: array
kind: function
operator: chunk-while
tests:
  - id: chunk-while.valid.operation
    cases:
      - id: chunk-while.valid.operation.numeric-gaps
        value: '{10, 20, 21, 22, 23, 24, 30, 31, 32, 40, 41}'
        parameters: ['subtract | is-less-than(2)']
        expected: '{{10}, {20, 21, 22, 23, 24}, {30, 31, 32}, {40, 41}}'
      - {id: chunk-while.valid.operation.always-true, value: '{1, 2, 3}', parameters: ['$1 | is-less-than(4)'], expected: '{{1, 2, 3}}'}
      - {id: chunk-while.valid.operation.always-false, value: '{1, 2, 3}', parameters: ['$1 | is-greater-than(4)'], expected: '{{1}, {2}, {3}}'}
      - {id: chunk-while.valid.operation.empty, value: '{}', parameters: [greater-than], expected: '{}'}
      - {id: chunk-while.valid.operation.singleton, value: '{10}', parameters: [greater-than], expected: '{{10}}'}
      - {id: chunk-while.valid.operation.special-null, value: (null), parameters: [greater-than], expected:}
