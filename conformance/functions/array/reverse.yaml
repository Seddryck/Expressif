suite: array
kind: function
operator: reverse
tests:
  - id: reverse.valid
    cases:
      - id: reverse.valid.numeric.multiple-elements
        value: [10,20,30,40]
        expected: [40,30,20,10]
      - id: reverse.valid.numeric.single-element
        value: [10]
        expected: [10]
      - id: reverse.valid.special.empty-array
        value: []
        expected: []
      - id: reverse.valid.special.null
        value: (null)
        expected: null
      - id: reverse.valid.special.empty
        value: (empty)
        expected: null
