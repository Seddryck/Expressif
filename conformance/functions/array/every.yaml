suite: array
kind: function
operator: every
tests:
  - id: every.valid
    cases:
      - id: every.valid.array.all-true
        value: "{#true, #true, #true}"
        expected: true
      - id: every.valid.array.contains-false
        value: "{#true, #false, #true}"
        expected: false
      - id: every.valid.special.empty
        value: (empty)
        expected: true
      - id: every.valid.special.null
        value: (null)
        expected:
