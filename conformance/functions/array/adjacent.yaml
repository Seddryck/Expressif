suite: array
kind: function
operator: adjacent
tests:
  - id: adjacent.valid.operation
    cases:
      - id: adjacent.valid.operation.special.null
        value: (null)
        expected:
        parameters: [subtract]
      - id: adjacent.valid.operation.special.empty
        value: (empty)
        expected:
        parameters: [subtract]
      - id: adjacent.valid.operation.array.empty
        value: []
        expected: []
        parameters: [subtract]
      - id: adjacent.valid.operation.array.values
        value: [100, 105, 120]
        expected: [5, 15]
        parameters: [subtract]

  - id: adjacent.explicit-binding
    cases:
      - id: adjacent.explicit-binding.direction
        value: [1, 2, 5]
        parameters: ['adjacent(~subtract)']
        expected: '{1, 3}'
