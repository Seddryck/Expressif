suite: join-full
kind: function
operator: join-full
tests:
  - id: join-full.valid
    cases:
      - id: join-full.valid.ordering
        value: (null)
        parameters: ['{1, 2, 2, 4} | join-full({3, 2, 1, 2, 5}, @_)']
        expected: '{(1 => 1), (2 => 2), (2 => 2), (2 => 2), (2 => 2), (4 => null), (null => 3), (null => 5)}'
      - id: join-full.valid.empty-left
        value: (null)
        parameters: ['{} | join-full({1}, @_)']
        expected: '{(null => 1)}'
      - id: join-full.valid.empty-right
        value: (null)
        parameters: ['{1} | join-full({}, @_)']
        expected: '{(1 => null)}'
      - id: join-full.valid.empty-both
        value: (null)
        parameters: ['{} | join-full({}, @_)']
        expected: '{}'
      - id: join-full.valid.null-keys
        value: (null)
        parameters: ['{#null, 1} | join-full({#null, 2}, @_)']
        expected: '{(null => null), (1 => null), (null => 2)}'
      - id: join-full.valid.grouping
        value: (null)
        parameters: ['{1, 2} | join-full(#{(1 => {"A", "B"}), (3 => {"C"}), (2 => {})}, @_)']
        expected: '{(1 => "A"), (1 => "B"), (2 => null), (null => "C")}'
      - id: join-full.valid.dictionary
        value: (null)
        parameters: ['{1, 2} | join-full(!{(1 => #null), (3 => "C")}, @_)']
        expected: '{(1 => null), (2 => null), (null => "C")}'
      - id: join-full.valid.composite
        value: (null)
        parameters: ['{T(1, 2)} | join-full({T(1, 2)}, @_)']
        expected: '{(T(1, 2) => T(1, 2))}'
      - id: join-full.valid.asymmetric
        value: (null)
        parameters: ['{{customer-id := 1}} | join-full({{id := 1}}, .customer-id, .id)']
        expected: '{({customer-id := 1} => {id := 1})}'
      - id: join-full.valid.named
        value: (null)
        parameters: ['{{customer-id := 1}} | join-full(right-key := .id, left-key := .customer-id, right := {{id := 1}})']
        expected: '{({customer-id := 1} => {id := 1})}'
      - id: join-full.valid.group-by
        value: (null)
        parameters: ['{1} | join-full({1, 1} | group-by(@_), @_)']
        expected: '{(1 => 1), (1 => 1)}'
