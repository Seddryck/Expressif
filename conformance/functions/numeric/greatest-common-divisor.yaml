suite: numeric
kind: function
operator: greatest-common-divisor
tests:
  - id: greatest-common-divisor.valid
    cases:
      - id: greatest-common-divisor.valid.numeric.eight-to-four-with-twelve
        value: 8
        expected: 4
        parameters:
          - 12
      - id: greatest-common-divisor.valid.numeric.twelve-to-four
        value: 12
        expected: 4
        parameters:
          - 8
      - id: greatest-common-divisor.valid.numeric.minus-eight
        value: -8
        expected: 4
        parameters:
          - 12
      - id: greatest-common-divisor.valid.numeric.eight-to-four-with-minus-twelve
        value: 8
        expected: 4
        parameters:
          - -12
      - id: greatest-common-divisor.valid.numeric.zero-to-twelve
        value: 0
        expected: 12
        parameters:
          - 12
      - id: greatest-common-divisor.valid.numeric.twelve-to-twelve
        value: 12
        expected: 12
        parameters:
          - 0
      - id: greatest-common-divisor.valid.numeric.zero-to-empty
        value: 0
        expected: 
        parameters:
          - 0
      - id: greatest-common-divisor.valid.special.null
        value: (null)
        expected: 
        parameters:
          - 12
      - id: greatest-common-divisor.valid.special.empty
        value: (empty)
        expected: 
        parameters:
          - 12
      - id: greatest-common-divisor.valid.special.blank
        value: (blank)
        expected: 
        parameters:
          - 12
      - id: greatest-common-divisor.valid.numeric.positive-7-5
        value: 7.5
        expected: 
        parameters:
          - 12
