suite: numeric
kind: function
operator: human-readable-format-decimal
tests:
  - id: human-readable-format-decimal.valid.default-precision
    cases:
      - id: human-readable-format-decimal.valid.default-precision.numeric.1048576
        value: 1048576
        expected: 1.05 M
      - id: human-readable-format-decimal.valid.default-precision.numeric.1000
        value: 1000
        expected: 1.00 k
      - id: human-readable-format-decimal.valid.default-precision.numeric.999
        value: 999
        expected: 999
      - id: human-readable-format-decimal.valid.default-precision.numeric.zero
        value: 0
        expected: 0
      - id: human-readable-format-decimal.valid.default-precision.numeric.minus-1048576
        value: -1048576
        expected: -1.05 M
  - id: human-readable-format-decimal.valid.precision
    cases:
      - id: human-readable-format-decimal.valid.precision.numeric.1048576-to-1-m
        value: 1048576
        expected: 1 M
        parameters:
          - 0
      - id: human-readable-format-decimal.valid.precision.numeric.1048576-to-1-049-m
        value: 1048576
        expected: 1.049 M
        parameters:
          - 3
      - id: human-readable-format-decimal.valid.precision.numeric.999
        value: 999
        expected: 999
        parameters:
          - 2
      - id: human-readable-format-decimal.valid.precision.numeric.1000
        value: 1000
        expected: 1 k
        parameters:
          - 0
