suite: numeric
kind: function
operator: round
tests:
  - id: round.valid
    cases:
      - id: round.valid.numeric.zero
        value: 0
        expected: 0
        parameters:
          - 2
      - id: round.valid.numeric.one
        value: 1
        expected: 1
        parameters:
          - 2
      - id: round.valid.numeric.minus-one
        value: -1
        expected: -1
        parameters:
          - 2
      - id: round.valid.numeric.positive-low-value
        value: 0.0001
        expected: 0
        parameters:
          - 2
      - id: round.valid.numeric.positive-below-rounding
        value: 0.489
        expected: 0.49
        parameters:
          - 2
      - id: round.valid.numeric.positive-above-rounding
        value: 0.491
        expected: 0.49
        parameters:
          - 2
      - id: round.valid.numeric.on-rounding
        value: 0.5
        expected: 0.5
        parameters:
          - 2
      - id: round.valid.numeric.positive-trailing-zero
        value: 0.501
        expected: 0.5
        parameters:
          - 2
      - id: round.valid.numeric.positive-trailing-zero-integer
        value: 0.9999
        expected: 1
        parameters:
          - 2
      - id: round.valid.numeric.negative-0-trailing-zero-integer
        value: -0.0001
        expected: 0
        parameters:
          - 2
      - id: round.valid.numeric.negative-half
        value: -0.5
        expected: -0.5
        parameters:
          - 2
      - id: round.valid.numeric.negative-trailing-zero-integer
        value: -0.9999
        expected: -1
        parameters:
          - 2
      - id: round.valid.special.null
        value: (null)
        expected: 
        parameters:
          - 2
      - id: round.valid.special.empty
        value: (empty)
        expected: 
        parameters:
          - 2
      - id: round.valid.special.blank
        value: (blank)
        expected: 
        parameters:
          - 2
