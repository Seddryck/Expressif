suite: numeric
kind: function
operator: oppose
tests:
  - id: oppose.valid  
    cases:
      - id: oppose.valid.numeric.zero
        value: 0
        expected: 0
      - id: oppose.valid.numeric.one
        value: 1
        expected: -1
      - id: oppose.valid.numeric.minus-one
        value: -1
        expected: 1
      - id: oppose.valid.numeric.four
        value: 4
        expected: -4
      - id: oppose.valid.numeric.minus-four
        value: -4
        expected: 4
      - id: oppose.valid.special.null
        value: null
        expected: null
      - id: oppose.valid.special.null-tag
        value: (null)
        expected: null
      - id: oppose.valid.special.empty-tag
        value: (empty)
        expected: null
      - id: oppose.valid.special.blank-tag
        value: (blank)
        expected: null
