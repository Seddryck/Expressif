suite: text
kind: function
operator: sentence-case
tests:
  - id: sentence-case.valid
    cases:
      - id: sentence-case.valid.text.basic
        value: customer order
        expected: Customer order
      - id: sentence-case.valid.text.array-words
        value:
          - customer
          - order
        expected: Customer order
      - id: sentence-case.valid.text.mixed-casing
        value: hello World
        expected: Hello world
      - id: sentence-case.valid.text.preserve-mixed-case-word
        value: new releases on iTunes are frequent
        expected: New releases on iTunes are frequent
      - id: sentence-case.valid.text.preserve-dotted-word
        value: visit example.com for updates
        expected: Visit example.com for updates
      - id: sentence-case.valid.text.preserve-ampersand-word
        value: read AT&T and Q&A references
        expected: Read AT&T and Q&A references
      - id: sentence-case.valid.special.null
        value: (null)
        expected: null
      - id: sentence-case.valid.special.empty
        value: (empty)
        expected: (empty)
      - id: sentence-case.valid.special.blank
        value: (blank)
        expected: (blank)
      - id: sentence-case.valid.special.zero-length-array
        value: []
        expected: null
