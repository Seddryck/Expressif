suite: text
kind: function
operator: retain-numeric
tests:
  - id: retain-numeric.valid
    cases:
      - id: retain-numeric.valid.text.abc12345abc6789
        value: abc12345abc6789
        expected: 123456789
      - id: retain-numeric.valid.text.abc12345abc-6789
        value: abc12345abc, 6789
        expected: 123456789
      - id: retain-numeric.valid.text.12345
        value: 12345
        expected: 12345
      - id: retain-numeric.valid.text.12-345-6
        value: -12,345.6
        expected: 123456
      - id: retain-numeric.valid.text.abc
        value: abc
        expected: (empty)
      - id: retain-numeric.valid.special.null
        value: (null)
        expected: (null)
      - id: retain-numeric.valid.special.empty
        value: (empty)
        expected: (empty)
      - id: retain-numeric.valid.special.blank
        value: (blank)
        expected: (empty)
