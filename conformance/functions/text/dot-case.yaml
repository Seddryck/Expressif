suite: text
kind: function
operator: dot-case
tests:
  - id: dot-case.valid
    cases:
      - id: dot-case.valid.text.basic
        value: customer order
        expected: customer.order
      - id: dot-case.valid.text.mixed-casing
        value: hello World
        expected: hello.world
      - id: dot-case.valid.text.array-words
        value:
          - customer
          - order
        expected: customer.order
      - id: dot-case.valid.special.null
        value: (null)
        expected: null
      - id: dot-case.valid.special.empty
        value: (empty)
        expected: (empty)
      - id: dot-case.valid.special.blank
        value: (blank)
        expected: (blank)
      - id: dot-case.valid.special.zero-length-array
        value: []
        expected: null
