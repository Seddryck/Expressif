suite: tuple
kind: function
operator: pick
tests:
  - id: pick.valid
    cases:
      - {id: pick.valid.reorder, value: 'T("John", "Smith", 42)', parameters: [1, 0], expected: 'T("Smith", "John")'}
      - {id: pick.valid.repeat, value: 'T("John", "Smith")', parameters: [1, 0, 1], expected: 'T("Smith", "John", "Smith")'}
