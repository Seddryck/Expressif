suite: tuple
kind: function
operator: label-conflicts
tests:
  - id: label-conflicts.valid
    cases:
      - id: label-conflicts.valid.mixed
        value: 'T(42, {key := 1, value := "Brol"}, "A", {key := 2, score := 10})'
        parameters: [id, left, grade, right]
        expected: '{id := 42, "left.key" := 1, value := "Brol", grade := "A", "right.key" := 2, score := 10}'
      - id: label-conflicts.valid.nested-tuple
        value: 'T(T(1, 2), {name := "Alice"})'
        parameters: [coordinates, customer]
        expected: '{coordinates := T(1, 2), name := "Alice"}'
      - id: label-conflicts.valid.pair
        value: '({key := 1, value := "Brol"} => {key := 1, grade := "A"})'
        parameters: [left, right]
        expected: '{"left.key" := 1, value := "Brol", "right.key" := 1, grade := "A"}'
      - id: label-conflicts.valid.empty
        value: 'tuple()'
        parameters: [[]]
        expected: '{}'
