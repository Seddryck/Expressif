suite: cube
kind: function
operator: cube
tests:
  - id: cube.valid.groups
    cases:
      - id: cube.valid.groups.composite
        value: (null)
        parameters: ['#{(T("BE", 2025) => {1, 2}), (T("FR", 2025) => {3}), (T("BE", 2026) => {4})} | cube']
        expected: '#{(T("BE", 2025) => {1, 2}), (T("FR", 2025) => {3}), (T("BE", 2026) => {4}), (T("BE", #all) => {1, 2, 4}), (T("FR", #all) => {3}), (T(#all, 2025) => {1, 2, 3}), (T(#all, 2026) => {4}), (T(#all, #all) => {1, 2, 3, 4})}'
      - id: cube.valid.groups.scalar
        value: (null)
        parameters: ['#{("B" => {2, 2}), ("A" => {1})} | cube']
        expected: '#{("B" => {2, 2}), ("A" => {1}), (#all => {2, 2, 1})}'
      - id: cube.valid.groups.null
        value: (null)
        parameters: ['#{(T(#null, 1) => {#null}), (T("#all", 1) => {2})} | cube']
        expected: '#{(T(null, 1) => {null}), (T("#all", 1) => {2}), (T(null, #all) => {null}), (T("#all", #all) => {2}), (T(#all, 1) => {null, 2}), (T(#all, #all) => {null, 2})}'
      - id: cube.valid.groups.null-scalar
        value: (null)
        parameters: ['#{(#null => {1}), ("#all" => {2})} | cube']
        expected: '#{(null => {1}), ("#all" => {2}), (#all => {1, 2})}'
      - id: cube.valid.groups.empty-grouping
        value: (null)
        parameters: ['#{} | cube']
        expected: '#{}'
      - id: cube.valid.groups.empty-groups
        value: (null)
        parameters: ['#{(T("B", 1) => {}), (T("A", 1) => {2})} | cube']
        expected: '#{(T("B", 1) => {}), (T("A", 1) => {2}), (T("B", #all) => {}), (T("A", #all) => {2}), (T(#all, 1) => {2}), (T(#all, #all) => {2})}'
      - id: cube.valid.groups.empty-tuple
        value: (null)
        parameters: ['#{(tuple() => {1})} | cube']
        expected: '#{(T() => {1})}'
      - id: cube.valid.groups.single-component
        value: (null)
        parameters: ['#{(tuple(1) => {2})} | cube']
        expected: '#{(T(1) => {2}), (T(#all) => {2})}'
      - id: cube.valid.groups.three-dimensions
        value: (null)
        parameters: ['#{(T(1, 2, 3) => {4})} | cube']
        expected: '#{(T(1, 2, 3) => {4}), (T(1, 2, #all) => {4}), (T(1, #all, 3) => {4}), (T(1, #all, #all) => {4}), (T(#all, 2, 3) => {4}), (T(#all, 2, #all) => {4}), (T(#all, #all, 3) => {4}), (T(#all, #all, #all) => {4})}'
      - id: cube.valid.groups.nested
        value: (null)
        parameters: ['#{(T(T(1, 2), 3) => {4})} | cube']
        expected: '#{(T(T(1, 2), 3) => {4}), (T(T(1, 2), #all) => {4}), (T(#all, 3) => {4}), (T(#all, #all) => {4})}'
      - id: cube.valid.groups.structural
        value: (null)
        parameters: ['#{(T({1}, 2) => {3}), (T({1}, 4) => {5})} | cube']
        expected: '#{(T({1}, 2) => {3}), (T({1}, 4) => {5}), (T({1}, #all) => {3, 5}), (T(#all, 2) => {3}), (T(#all, 4) => {5}), (T(#all, #all) => {3, 5})}'
      - id: cube.valid.groups.array-scalar
        value: (null)
        parameters: ['#{({1, 2} => {3})} | cube']
        expected: '#{({1, 2} => {3}), (#all => {3})}'
      - id: cube.valid.groups.summarize
        value: (null)
        parameters: ['{1, 2, 3} | group-by(1, add(0)) | cube | summarize(sum)']
        expected: '!{(T(1, 1) => 1), (T(1, 2) => 2), (T(1, 3) => 3), (T(1, #all) => 6), (T(#all, 1) => 1), (T(#all, 2) => 2), (T(#all, 3) => 3), (T(#all, #all) => 6)}'
