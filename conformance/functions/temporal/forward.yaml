suite: temporal
kind: function
operator: forward
tests:
  - id: forward.valid
    cases:
      - id: forward.valid.4hours-0times.temporal.any-date
        value: 2019-03-11 17:00:00
        expected: 2019-03-11 17:00:00
        parameters:
          - 04:00:00
          - 0
      - id: forward.valid.4hours-1time.temporal.no-change-date
        value: 2019-03-11 17:00:00
        expected: 2019-03-11 21:00:00
        parameters:
          - 04:00:00
          - 1
      - id: forward.valid.4hours-2times.temporal.change-date
        value: 2019-03-11 17:00:00
        expected: 2019-03-12 01:00:00
        parameters:
          - 04:00:00
          - 2
      - id: forward.valid.4hours-minus-1time.temporal.no-change-date
        value: 2019-03-11 17:00:00
        expected: 2019-03-11 13:00:00
        parameters:
          - 04:00:00
          - -1
