suite: temporal
kind: function
operator: change-of-month
tests:
  - id: change-of-month.valid.date-time
    cases:
      - id: change-of-month.valid.date-time.temporal.1900-01-01
        value: 1900-01-01
        expected: 1900-03-01
        parameters:
          - 3
      - id: change-of-month.valid.date-time.temporal.2000-01-31-to-2000-03-31
        value: 2000-01-31
        expected: 2000-03-31
        parameters:
          - 3
      - id: change-of-month.valid.date-time.temporal.2000-01-31-to-2000-04-30
        value: 2000-01-31
        expected: 2000-04-30
        parameters:
          - 4
      - id: change-of-month.valid.date-time.temporal.2000-01-31-to-2000-02-29
        value: 2000-01-31
        expected: 2000-02-29
        parameters:
          - 2
      - id: change-of-month.valid.date-time.temporal.2001-01-31
        value: 2001-01-31
        expected: 2001-02-28
        parameters:
          - 2
  - id: change-of-month.invalid.date-time
    cases:
      - id: change-of-month.invalid.date-time.temporal.1900-01-01-to-null-with-minus-one
        value: 1900-01-01
        expected: "(null)"
        parameters:
          - -1
      - id: change-of-month.invalid.date-time.temporal.1900-01-01-to-null-with-zero
        value: 1900-01-01
        expected: "(null)"
        parameters:
          - 0
      - id: change-of-month.invalid.date-time.temporal.1900-01-01-to-null-with-13
        value: 1900-01-01
        expected: "(null)"
        parameters:
          - 13
  - id: change-of-month.valid.year-month
    cases:
      - id: change-of-month.valid.year-month.temporal.1900-01-to-1900-03-with-three-source-line-54
        value: 1900-01
        expected: 1900-03
        parameters:
          - 3
      - id: change-of-month.valid.year-month.temporal.1900-01-to-1900-03-with-three-source-line-55
        value: 1900-01
        expected: 1900-03
        parameters:
          - 3
      - id: change-of-month.valid.year-month.temporal.2000-01
        value: 2000-01
        expected: 2000-01
        parameters:
          - 1
      - id: change-of-month.valid.year-month.temporal.0800-01
        value: 0800-01
        expected: 0800-03
        parameters:
          - 3
  - id: change-of-month.invalid.year-month
    cases:
      - id: change-of-month.invalid.year-month.temporal.1900-01-to-null-with-minus-one
        value: 1900-01
        expected: "(null)"
        parameters:
          - -1
      - id: change-of-month.invalid.year-month.temporal.1900-01-to-null-with-zero
        value: 1900-01
        expected: "(null)"
        parameters:
          - 0
      - id: change-of-month.invalid.year-month.temporal.1900-01-to-null-with-13
        value: 1900-01
        expected: "(null)"
        parameters:
          - 13
