suite: temporal
kind: function
operator: month
tests:
  - id: month.valid.date-time
    cases:
      - id: month.valid.date-time.temporal.1900-01-01
        value: 1900-01-01
        expected: 01
      - id: month.valid.date-time.temporal.2000-10-01
        value: 2000-10-01
        expected: 10
      - id: month.valid.date-time.temporal.800-03-01
        value: 800-03-01
        expected: 03
  - id: month.valid.year-month
    cases:
      - id: month.valid.year-month.temporal.1900-01
        value: 1900-01
        expected: 01
      - id: month.valid.year-month.temporal.2000-10
        value: 2000-10
        expected: 10
      - id: month.valid.year-month.temporal.0800-03
        value: 0800-03
        expected: 03
  - id: month.invalid.integer
    cases:
      - id: month.invalid.integer.temporal.one
        value: 1
        expected: null
      - id: month.invalid.integer.temporal.ten
        value: 10
        expected: null
