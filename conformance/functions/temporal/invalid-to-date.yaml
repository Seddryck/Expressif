suite: temporal
kind: function
operator: null-to-date
tests:
  - id: invalid-to-date.valid
    cases:
      - id: invalid-to-date.valid.temporal.2018-02-01-07-00-00
        value: 2018-02-01 07:00:00
        expected: 2018-02-01 07:00:00
        parameters:
          - 2001-01-01
      - id: invalid-to-date.valid.special.empty
        value: (empty)
        expected: 2001-01-01
        parameters:
          - 2001-01-01
      - id: invalid-to-date.valid.temporal.2018-02-31
        value: "2018-02-31"
        expected: 2001-01-01
        parameters:
          - 2001-01-01
      - id: invalid-to-date.valid.special.null-to-null-with-2001-01-01-source-line-
        value: "(null)"
        expected: null
        parameters:
          - 2001-01-01
      - id: invalid-to-date.valid.special.null-to-null-with-2001-01-01-source-line-
        value: null
        expected: null
        parameters:
          - 2001-01-01
