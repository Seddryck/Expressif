        value: 2000-02-15
        expected: 29
      - id: length-of-month.valid.date-time.temporal.2023-02-15
        value: 2023-02-15
        expected: 28
      - id: length-of-month.valid.date-time.temporal.2024-02-15
        value: 2024-02-15
