suite: array
kind: accumulator
operator: closest
tests:
  - id: closest.selection
    parameters:
      - target
    cases:
      - id: closest.selection.nearest
        value: '{10, 30, 50}'
        parameters:
          - '32'
        expected: '30'
      - id: closest.selection.tie
        value: '{10, 30}'
        parameters:
          - '20'
        expected: '10'
      - id: closest.selection.reversed.tie
        value: '{30, 10}'
        parameters:
          - '20'
        expected: '30'
      - id: closest.selection.negative
        value: '{-10, -30, 50}'
        parameters:
          - '-32'
        expected: '-30'
      - id: closest.selection.decimal
        value: '{1.1, 1.3, 1.5}'
        parameters:
          - '1.32'
        expected: '1.3'
      - id: closest.selection.exact
        value: '{30, 10, 20}'
        parameters:
          - '20'
        expected: '20'
      - id: closest.selection.single
        value: '{10}'
        parameters:
          - '20'
        expected: '10'
      - id: closest.selection.empty
        value: '{}'
        parameters:
          - '20'
        expected:
      - id: closest.selection.null.target
        value: '{10, 20, 30}'
        parameters:
          - '#null'
        expected:
      - id: closest.selection.null.values
        value: '{#null, 10, 30}'
        parameters:
          - '20'
        expected: '10'
      - id: closest.selection.only.null
        value: '{#null, #null}'
        parameters:
          - '20'
        expected:
      - id: closest.selection.numeric.text
        value: '{"10", "30", "50"}'
        parameters:
          - '"32"'
        expected: '"30"'
      - id: closest.selection.invalid.value
        value: '{"invalid", 30}'
        parameters:
          - '32'
        expected: '30'
      - id: closest.selection.invalid.target
        value: '{10, 30}'
        parameters:
          - '"invalid"'
        expected:
      - id: closest.selection.dates
        value: '{"2024-01-01", "2024-01-10", "2024-01-20"}'
        parameters:
          - '"2024-01-12"'
        expected: '"2024-01-10"'
      - id: closest.selection.date.tie
        value: '{"2024-01-20", "2024-01-10"}'
        parameters:
          - '"2024-01-15"'
        expected: '"2024-01-20"'
      - id: closest.selection.date.time
        value: '{"2024-01-01T10:00:00", "2024-01-01T12:00:00"}'
        parameters:
          - '"2024-01-01T11:30:00"'
        expected: '"2024-01-01T12:00:00"'
      - id: closest.selection.incompatible.temporal
        value: '{10, "invalid", "2024-01-10"}'
        parameters:
          - '"2024-01-12"'
        expected: '"2024-01-10"'
