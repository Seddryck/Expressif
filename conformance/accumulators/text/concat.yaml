suite: text
kind: accumulator
operator: concat
tests:
  - id: concat.without-separator
    cases:
      - id: concat.without-separator.multiple
        value: '{"a", "b", "c"}'
        expected: abc
      - id: concat.without-separator.single
        value: '{"a"}'
        expected: a
      - id: concat.without-separator.empty
        value: (empty)
        expected: ''
  - id: concat.with-separator
    parameters:
      - separator
    cases:
      - id: concat.with-separator.multiple
        value: '{"a", "b", "c"}'
        parameters:
          - '-'
        expected: a-b-c
      - id: concat.with-separator.single
        value: '{"a"}'
        parameters:
          - '-'
        expected: a
      - id: concat.with-separator.empty
        value: (empty)
        parameters:
          - '-'
        expected: ''
      - id: concat.with-separator.empty-value
        value: '{"a", "", "b"}'
        parameters:
          - '-'
        expected: a--b
