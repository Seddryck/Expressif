workflow: GitHubFlow/v1

major-version-bump-message: "^(feat|fix|perf|revert)(\\([\\w\\s-]*\\))?(!:|:.*\\n\\n((.+\\n)+\\n)?BREAKING CHANGE:\\s.+)"
minor-version-bump-message: "^(feat)(\\([\\w\\s-]*\\))?:|\\+semver:\\s?(feature|minor)"
patch-version-bump-message: "^(chore|fix|perf|refactor|revert|build|ci|style)(\\([\\w\\s-]*\\))?:"
no-bump-message: "\\+semver:\\s?(none|skip)"
commit-message-incrementing: Enabled
branches:
  main:
    regex: ^main$
    is-main-branch: true
    increment: Patch
    mode: ContinuousDeployment
  next-major:
    regex: ^(?<BranchName>next-major)$
    increment: Major
    source-branches:
    - main
  v3:
    label: beta.v3
    regex: ^feat/v3\.0$
    increment: Major
    source-branches:
    - main
    is-source-branch-for:
    - feature
    - pull-request
  feature:
    label: beta.{BranchName}
    regex: ^(feat(ure)?s?)[/-](?!v3\.0$)(?<BranchName>.+)
    increment: Inherit
    source-branches:
    - main
    - v3
    - feature
  pull-request:
    source-branches:
    - main
    - release
    - v3
    - feature
ignore:
  sha: []
merge-message-formats: {}
